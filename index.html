<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tatlı Tepsi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F1E7D3; --paperDark:#E7D9BC; --ink:#2E2013; --inkSoft:#6B5A42;
    --walnut:#2E2013; --gold:#C1852B; --pistachio:#77875A; --pistachioDark:#5C6944;
    --brick:#A2472C; --cream:#FBF6EA; --line:#D8C6A3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Public Sans',sans-serif;color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer;font-family:'Public Sans',sans-serif;}
  input,select{font-family:'Public Sans',sans-serif;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-size:14px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;border:none;font-weight:600;font-size:14px;}
  .btn-primary{background:var(--walnut);color:var(--cream);}
  .btn-gold{background:var(--gold);color:var(--cream);}
  .btn-outline{background:transparent;color:var(--walnut);border:1px solid var(--walnut);}
  .btn-ghost{background:transparent;color:var(--inkSoft);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .card{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .badge{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;}
  .grid{display:grid;gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:700px){.g2,.g3{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:8px 10px;background:var(--paperDark);color:var(--inkSoft);font-size:12px;}
  td{padding:8px 10px;border-top:1px solid var(--line);background:var(--cream);}
  .topbar{background:var(--walnut);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px));}
  .tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 20px 0;border-bottom:1px solid var(--line);}
  .tab{padding:9px 16px;font-size:14px;font-weight:600;color:var(--inkSoft);background:transparent;border:none;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.active{color:var(--ink);border-bottom-color:var(--gold);}
  .content{padding:20px;max-width:960px;margin:0 auto;}
  .ticket{position:relative;background:var(--cream);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:'IBM Plex Mono',monospace;padding:16px;font-size:13px;}
  .ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:8px;
    background-image:radial-gradient(circle, var(--paper) 5px, transparent 5.5px);background-size:14px 14px;}
  .ticket::before{top:0;background-position:-2px -7px;}
  .ticket::after{bottom:0;background-position:-2px 3px;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .muted{color:var(--inkSoft);}
  .statusbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .statusbtn{font-size:12px;padding:5px 10px;border-radius:99px;font-weight:600;background:transparent;}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:420px;}
  .logo{width:64px;height:64px;border-radius:50%;background:var(--walnut);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px;}
  .modetabs{display:flex;background:var(--paperDark);border:1px solid var(--line);border-radius:12px;padding:5px;gap:4px;margin-bottom:18px;}
  .modetab{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;font-weight:600;font-size:13px;color:var(--inkSoft);}
  .modetab.active{background:var(--cream);color:var(--ink);}
  .cartqty{display:flex;align-items:center;gap:8px;}
  .qtybtn{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--cream);font-weight:700;}
  .kwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .kchip{font-size:12px;padding:6px 12px;border-radius:99px;font-weight:600;border:1px solid var(--pistachioDark);background:transparent;color:var(--inkSoft);}
  .kchip.on{background:var(--pistachioDark);color:var(--cream);}
  .banner{margin-bottom:20px;padding:14px;border-radius:10px;background:var(--cream);border:1px dashed var(--gold);}
  .warn{margin-bottom:16px;padding:12px;border-radius:10px;background:var(--cream);border:1px dashed var(--brick);color:var(--brick);font-size:13px;}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--inkSoft);}
  a.file-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:8px;font-weight:600;font-size:14px;background:var(--pistachio);color:var(--cream);cursor:pointer;}
</style>
</head>
<body>
<div id="app" class="loading">Yükleniyor…</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRuFGRAAzPrr5C6gQO-NtzjkUgJ4fcI7I",
  authDomain: "tatli-tepsi-siparis.firebaseapp.com",
  projectId: "tatli-tepsi-siparis",
  storageBucket: "tatli-tepsi-siparis.firebasestorage.app",
  messagingSenderId: "1050308349655",
  appId: "1:1050308349655:web:3dac655da7768144ffaa92",
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ---------------- state ---------------- */
const S = {
  loaded: { kitchens:false, products:false, customers:false, producers:false, orders:false, units:false },
  kitchens: [], products: [], customers: [], producers: [], orders: [], units: ["kg","adet","tepsi","paket","litre"],
  user: null,        // {type:'admin'|'customer'|'producer', ...}
  loginMode: "customer",
  adminTab: "orders",
  custTab: "new",
  prodTab: "summary",
  cart: {},           // productId -> qty (customer)
};

const ADMIN_PASSWORD = "fatihtemel1453";
const STATUS_FLOW = ["Bekliyor","Hazırlanıyor","Hazır","Teslim Edildi"];
const STATUS_COLOR = { "Bekliyor":"var(--brick)", "Hazırlanıyor":"var(--gold)", "Hazır":"var(--pistachioDark)", "Teslim Edildi":"var(--inkSoft)" };

function money(n){ return (n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₺"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function kitchenName(id){ const k = S.kitchens.find(x=>x.id===id); return k? k.name : "—"; }

/* ---------------- Firestore live sync ---------------- */
function watchCollection(name, targetKey){
  onSnapshot(collection(db, name), (snap) => {
    S[targetKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded[targetKey] = true;
    maybeRender();
  }, (err) => {
    console.error(name, err);
    S.loaded[targetKey] = true;
    S.loadErrors = S.loadErrors || [];
    S.loadErrors.push(name + ": " + err.message);
    maybeRender();
  });
}
watchCollection("kitchens","kitchens");
watchCollection("products","products");
watchCollection("customers","customers");
watchCollection("producers","producers");
watchCollection("orders","orders");

onSnapshot(doc(db,"meta","units"), (d) => {
  if (d.exists() && Array.isArray(d.data().list) && d.data().list.length) S.units = d.data().list;
  S.loaded.units = true;
  maybeRender();
}, (err)=>{ S.loaded.units = true; maybeRender(); });

function allLoaded(){ return Object.values(S.loaded).every(Boolean); }
function maybeRender(){ if (allLoaded()) render(); }

// Emniyet: 10 saniye içinde yüklenme tamamlanmazsa (ör. internet/CDN sorunu),
// yine de ekranı göster ve kullanıcıyı bilgilendir — sonsuza kadar "Yükleniyor" ekranında kalınmasın.
setTimeout(() => {
  if (!allLoaded()) {
    Object.keys(S.loaded).forEach(k => { if (!S.loaded[k]) S.loaded[k] = true; });
    S.loadErrors = S.loadErrors || [];
    S.loadErrors.push("Bağlantı zaman aşımına uğradı — internet bağlantınızı kontrol edin.");
    render();
  }
}, 10000);

/* ---------------- writes ---------------- */
async function addDocTo(col, data){ return addDoc(collection(db,col), data); }
async function updateDocIn(col, id, data){ return updateDoc(doc(db,col,id), data); }
async function deleteDocIn(col, id){ return deleteDoc(doc(db,col,id)); }
async function saveUnits(list){ return setDoc(doc(db,"meta","units"), { list }); }

/* ---------------- root render ---------------- */
function render(){
  const app = document.getElementById("app");
  app.className = "";
  const errBanner = (S.loadErrors && S.loadErrors.length)
    ? `<div class="warn" style="max-width:700px;margin:14px auto 0;">
         ⚠ Firestore bağlantı sorunu: ${esc(S.loadErrors[0])}<br/>
         Firebase konsolunda <b>Firestore Database → Rules</b> kısmında okuma/yazma izninin açık olduğundan emin olun.
       </div>` : "";
  if (!S.user) { app.innerHTML = loginView() + errBanner; bindLogin(); return; }
  if (S.user.type === "admin") { app.innerHTML = adminView() + errBanner; bindAdmin(); return; }
  if (S.user.type === "producer") { app.innerHTML = producerView() + errBanner; bindProducer(); return; }
  app.innerHTML = customerView() + errBanner; bindCustomer();
}

/* ================= LOGIN ================= */
function loginView(){
  return `
  <div class="login-wrap">
    <div class="login-box">
      <div style="text-align:center;margin-bottom:26px;">
        <div class="logo">🧁</div>
        <h1 style="font-size:32px;">Tatlı Tepsi</h1>
        <p class="muted" style="margin-top:4px;">Mutfaktan raporlara, tek tepside sipariş yönetimi</p>
      </div>
      <div class="modetabs">
        <button class="modetab ${S.loginMode==='customer'?'active':''}" data-mode="customer">Müşteri</button>
        <button class="modetab ${S.loginMode==='producer'?'active':''}" data-mode="producer">Üretici</button>
        <button class="modetab ${S.loginMode==='admin'?'active':''}" data-mode="admin">Yönetici</button>
      </div>
      <div class="card">
        ${S.loginMode==='admin' ? `
          <p class="muted" style="font-size:14px;">Ürünleri, mutfakları, müşterileri ve üreticileri yönetin; tüm siparişleri ve raporları görüntüleyin.</p>
          <input id="adminPassword" type="password" placeholder="Yönetici şifresi" style="width:100%;margin:10px 0;" />
          <div id="adminLoginError" style="color:var(--brick);font-size:13px;margin-bottom:8px;"></div>
          <button class="btn btn-primary" id="adminLoginBtn" style="width:100%;justify-content:center;">Yönetici Olarak Gir</button>
        ` : `
          <label class="muted" style="font-size:12px;font-weight:600;text-transform:uppercase;">Kullanıcı Adı</label>
          <input id="loginUsername" style="width:100%;margin:6px 0 10px;" placeholder="${S.loginMode==='customer'?'örn. yildizmarket':'örn. ahmetusta'}" />
          <div id="loginError" style="color:var(--brick);font-size:13px;margin-bottom:8px;"></div>
          <button class="btn btn-gold" id="userLoginBtn" style="width:100%;justify-content:center;">Giriş Yap</button>
        `}
      </div>
    </div>
  </div>`;
}
function bindLogin(){
  document.querySelectorAll(".modetab").forEach(b=>b.onclick=()=>{ S.loginMode=b.dataset.mode; render(); });
  const adminBtn = document.getElementById("adminLoginBtn");
  if (adminBtn) adminBtn.onclick = () => {
    const pass = document.getElementById("adminPassword").value;
    if (pass === ADMIN_PASSWORD) { S.user = { type:"admin" }; render(); }
    else { document.getElementById("adminLoginError").textContent = "Şifre yanlış."; }
  };
  const adminPassInput = document.getElementById("adminPassword");
  if (adminPassInput) adminPassInput.onkeydown = (e) => { if (e.key==="Enter") adminBtn.click(); };
  const userBtn = document.getElementById("userLoginBtn");
  if (userBtn) userBtn.onclick = () => {
    const val = document.getElementById("loginUsername").value.trim().toLocaleLowerCase("tr-TR");
    const list = S.loginMode === "customer" ? S.customers : S.producers;
    const found = list.find(c => (c.username||"").toLocaleLowerCase("tr-TR") === val);
    if (found) { S.user = { type: S.loginMode, ...found }; render(); }
    else document.getElementById("loginError").textContent = "Kullanıcı adı bulunamadı. Yöneticinize danışın.";
  };
}

/* ================= SHELL ================= */
function shell(subtitle, tabs, activeKey, contentHtml){
  return `
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo" style="width:38px;height:38px;font-size:18px;background:var(--gold);color:var(--walnut);">🧁</div>
      <div>
        <div style="color:var(--cream);font-weight:700;font-family:'Fraunces',serif;font-size:17px;">Tatlı Tepsi</div>
        <div style="color:#D8C6A3;font-size:12px;">${esc(subtitle)}</div>
      </div>
    </div>
    <button class="btn" id="logoutBtn" style="color:var(--cream);border:1px solid rgba(193,133,43,.4);background:transparent;">Çıkış</button>
  </div>
  <div class="tabs">
    ${tabs.map(t=>`<button class="tab ${activeKey===t.key?'active':''}" data-tab="${t.key}">${esc(t.label)}</button>`).join("")}
  </div>
  <div class="content">${contentHtml}</div>`;
}

/* ================= TICKET ================= */
function ticketHtml(o, opts={}){
  const { showCustomer=true, kitchenFilter=null, hidePrices=false } = opts;
  let items = kitchenFilter ? o.items.filter(it=>kitchenFilter.includes(it.kitchen)) : o.items;
  if (kitchenFilter && items.length===0) return "";
  const grouped = {};
  items.forEach(it=>{ (grouped[it.kitchen] = grouped[it.kitchen]||[]).push(it); });
  const shownTotal = items.reduce((s,it)=>s+it.qty*it.price,0);
  let html = `<div class="ticket">
    <div class="row" style="margin-bottom:6px;">
      <span class="muted" style="font-size:11px;letter-spacing:1px;">SİPARİŞ #${esc(o.no)}</span>
      <span class="badge" style="background:${STATUS_COLOR[o.status]}22;color:${STATUS_COLOR[o.status]};border:1px solid ${STATUS_COLOR[o.status]}55;">${esc(o.status)}</span>
    </div>
    ${showCustomer ? `<div style="font-weight:700;font-size:14px;margin-bottom:2px;">${esc(o.customerName)}</div>` : ""}
    <div class="muted" style="font-size:11px;margin-bottom:10px;">${new Date(o.createdAt).toLocaleString("tr-TR")}${o.note?` · not: ${esc(o.note)}`:""}</div>`;
  Object.entries(grouped).forEach(([kName, its])=>{
    html += `<div style="margin-bottom:8px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--pistachioDark);">── ${esc(kName)} ──</div>`;
    its.forEach(it=>{
      html += `<div class="row" style="font-size:12px;padding:2px 0;">
        <span>${it.qty}${it.unit?" "+esc(it.unit):""} × ${esc(it.name)}</span>
        ${hidePrices?"":`<span>${money(it.qty*it.price)}</span>`}
      </div>`;
    });
    html += `</div>`;
  });
  if (!hidePrices){
    html += `<div class="row" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700;font-size:13px;">
      <span>${kitchenFilter?"MUTFAK TOPLAMI":"TOPLAM"}</span><span>${money(shownTotal)}</span></div>`;
  }
  if (o.delivery){
    html += `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;">`;
    if (o.delivery.type === "full") {
      html += `<span style="color:var(--pistachioDark);font-weight:700;">✓ Müşteri: Tam Teslim Alındı</span>`;
    } else {
      html += `<span style="color:var(--brick);font-weight:700;">⚠ Müşteri: Eksik Bildirildi</span>`;
      (o.delivery.shortages||[]).forEach(s=>{
        html += `<div style="color:var(--brick);">– ${esc(s.name)}: ${s.missingQty}${s.unit?" "+esc(s.unit):""} eksik</div>`;
      });
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

/* ================= ADMIN ================= */
const ADMIN_TABS = [
  {key:"orders", label:"Siparişler"},
  {key:"products", label:"Ürünler"},
  {key:"customers", label:"Müşteriler"},
  {key:"producers", label:"Üreticiler"},
  {key:"kitchens", label:"Mutfaklar"},
  {key:"reports", label:"Raporlar"},
  {key:"reportgen", label:"Rapor Oluştur"},
];
function adminView(){
  let body = "";
  const empty = S.kitchens.length===0 && S.products.length===0 && S.customers.length===0;
  if (empty) {
    body += `<div class="banner row" style="flex-wrap:wrap;gap:10px;">
      <div style="font-size:13px;" class="muted">Henüz veri yok. Mutfaklar sekmesinden başlayın.</div>
    </div>`;
  }
  if (S.adminTab==="orders") body += adminOrdersTab();
  if (S.adminTab==="products") body += adminProductsTab();
  if (S.adminTab==="customers") body += adminCustomersTab();
  if (S.adminTab==="producers") body += adminProducersTab();
  if (S.adminTab==="kitchens") body += adminKitchensTab();
  if (S.adminTab==="reports") body += adminReportsTab();
  if (S.adminTab==="reportgen") body += adminReportGenTab();
  return shell("Yönetici Paneli", ADMIN_TABS, S.adminTab, body);
}

  return `
  <h2>🍽️ Mutfaklar</h2>
  <p class="muted" style="font-size:13px;margin:6px 0 14px;">Önce burada mutfakları tanımlayın — ürünleri ve üreticileri bu mutfaklara bağlayacaksınız.</p>
  <div class="row" style="gap:8px;margin-bottom:18px;">
    <input id="newKitchenName" placeholder="Yeni mutfak adı (örn. Kadayıf Mutfağı)" style="flex:1;" />
    <button class="btn btn-primary" id="addKitchenBtn">+ Ekle</button>

}

  return `
  <div class="row" style="margin-bottom:14px;">
    <h2>📦 Ürünler</h2>
    <label class="file-btn">⬆ Excel'den Aktar<input type="file" id="importProducts" accept=".xlsx,.xls,.csv" style="display:none;"></label>

    <div class="row" style="gap:6px;">

  <div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px;">
    <table><thead><tr><th>Ürün</th><th>Mutfak</th><th>Fiyat</th><th>Birim</th><th></th></tr></thead>
    <tbody>
      ${S.products.map(p=>`
        <tr><td>${esc(p.name)}</td><td class="muted">${esc(kitchenName(p.kitchenId))}</td><td>${money(p.price)}</td><td class="muted">${esc(p.unit)||"—"}</td>
        <td><button class="btn btn-ghost" data-del-product="${p.id}" style="color:var(--brick);">✕</button></td></tr>`).join("")
        || `<tr><td colspan="5" style="text-align:center;" class="muted">Ürün bulunamadı.</td></tr>`}

function adminCustomersTab(){
  return `
  <div class="row" style="margin-bottom:14px;">
    <h2>👥 Müşteriler</h2>
    <label class="file-btn">⬆ Excel'den Aktar<input type="file" id="importCustomers" accept=".xlsx,.xls,.csv" style="display:none;"></label>
  </div>
  <div class="card grid g3" style="margin-bottom:14px;">
    <input id="cName" placeholder="Müşteri / mağaza adı" />
    <input id="cUsername" placeholder="Kullanıcı adı" />

window.__reportSearch = function(q){
  const el = document.getElementById("productSearchResult");
  if (!el) return;
  q = q.trim().toLocaleLowerCase("tr-TR");
  if (!q) { el.innerHTML = ""; return; }
  const byProduct = {}, byRevenue = {};
  S.orders.forEach(o=>o.items.forEach(it=>{
    if (it.name.toLocaleLowerCase("tr-TR").includes(q)) {
      byProduct[it.name] = (byProduct[it.name]||0) + it.qty;
      byRevenue[it.name] = (byRevenue[it.name]||0) + it.qty*it.price;
    }
  }));
  const entries = Object.entries(byProduct);
  const totalQty = entries.reduce((s,[,v])=>s+v,0);
  const totalRev = Object.values(byRevenue).reduce((s,v)=>s+v,0);
  if (!entries.length) { el.innerHTML = `<p class="muted" style="font-size:13px;">Eşleşen ürün yok.</p>`; return; }
  el.innerHTML = `<div class="row" style="font-weight:700;margin-bottom:6px;"><span>Toplam: ${totalQty} adet/kg/tepsi</span><span>${money(totalRev)}</span></div>` +
    entries.map(([n,q])=>`<div class="row" style="font-size:13px;padding:2px 0;"><span>${esc(n)}</span><span>${q} · ${money(byRevenue[n])}</span></div>`).join("");
};

  if (importProducts) importProducts.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const rows = await parseExcel(file);
    const normKey = k => k.toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9]/g,"");
    const pick = (row,kws) => { const keys=Object.keys(row); for (const kw of kws){ const f=keys.find(k=>normKey(k).includes(kw)); if (f) return row[f]; } return undefined; };
    for (const r of rows) {
      const name = String(pick(r,["urun","ad","name"])||"").trim();
      if (!name) continue;
      const kName = String(pick(r,["mutfak","kitchen"])||"").trim();
      let kitchen = S.kitchens.find(k=>k.name.toLocaleLowerCase("tr-TR")===kName.toLocaleLowerCase("tr-TR"));
      if (!kitchen && kName) { const ref = await addDocTo("kitchens", {name:kName}); kitchen = {id:ref.id, name:kName}; S.kitchens.push(kitchen); }
      await addDocTo("products", { name, kitchenId: kitchen ? kitchen.id : (S.kitchens[0]?.id||""), price: Number(pick(r,["fiyat","price"])||0), unit: String(pick(r,["birim","unit"])||"").trim() });
    }
    e.target.value = "";
  };

  // customers
  const saveCustomer = document.getElementById("saveCustomerBtn");
  if (saveCustomer) saveCustomer.onclick = async () => {
    const name = document.getElementById("cName").value.trim();
    const username = document.getElementById("cUsername").value.trim().toLocaleLowerCase("tr-TR");
    if (!name || !username) return;
    if (S.customers.some(c=>c.username===username)) { alert("Bu kullanıcı adı zaten var."); return; }
    await addDocTo("customers", { name, username });
    document.getElementById("cName").value=""; document.getElementById("cUsername").value="";
  };
  document.querySelectorAll("[data-del-customer]").forEach(b=>b.onclick=()=>deleteDocIn("customers", b.dataset.delCustomer));
  const importCustomers = document.getElementById("importCustomers");
  if (importCustomers) importCustomers.onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    const rows = await parseExcel(file);
    const normKey = k => k.toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9]/g,"");
    const pick = (row,kws) => { const keys=Object.keys(row); for (const kw of kws){ const f=keys.find(k=>normKey(k).includes(kw)); if (f) return row[f]; } return undefined; };
    for (const r of rows) {
      const name = String(pick(r,["musteriad","isim","ad","name","musteri"])||"").trim();
      const username = String(pick(r,["kullaniciadi","username","kullanici"])||"").trim().toLocaleLowerCase("tr-TR");
      if (name && username) await addDocTo("customers", { name, username });
    }
    e.target.value = "";
  };

  // producers
  let selectedKitchens = [];
  document.querySelectorAll("[data-kchip]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.kchip;
    selectedKitchens = selectedKitchens.includes(id) ? selectedKitchens.filter(x=>x!==id) : [...selectedKitchens, id];
    b.classList.toggle("on");
  });
  const saveProducer = document.getElementById("saveProducerBtn");
  if (saveProducer) saveProducer.onclick = async () => {
    const name = document.getElementById("prName").value.trim();
    const username = document.getElementById("prUsername").value.trim().toLocaleLowerCase("tr-TR");
    if (!name || !username || selectedKitchens.length===0) return;
    await addDocTo("producers", { name, username, kitchenIds: selectedKitchens });
  };
  document.querySelectorAll("[data-del-producer]").forEach(b=>b.onclick=()=>deleteDocIn("producers", b.dataset.delProducer));

  // orders
  document.querySelectorAll("[data-set-status]").forEach(b=>b.onclick=()=>{
    const [id, status] = b.dataset.setStatus.split("|");
    updateDocIn("orders", id, { status });
  });

  // report generator
  const rgExport = document.getElementById("rgExportBtn");
  if (rgExport) rgExport.onclick = () => {
    const custId = document.getElementById("rgCustomer").value;
    const scoped = S.orders.filter(o => custId==="all" || o.customerId===custId);
    const rows = [];
    scoped.forEach(o=>o.items.forEach(it=>{
      rows.push({ Tarih: new Date(o.createdAt).toLocaleString("tr-TR"), "Sipariş No": o.no, Müşteri: o.customerName, Ürün: it.name, Mutfak: it.kitchen, Miktar: it.qty, Birim: it.unit||"", "Birim Fiyat": it.price, Tutar: it.qty*it.price, Durum: o.status });
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Rapor");
    XLSX.writeFile(wb, `tatli-tepsi-rapor-${new Date().toISOString().slice(0,10)}.xlsx`);
  };
  const rgCustomerSel = document.getElementById("rgCustomer");
  function renderRgResult(){
    const custId = rgCustomerSel.value;
    const scoped = S.orders.filter(o => custId==="all" || o.customerId===custId);
    const total = scoped.reduce((s,o)=>s+o.total,0);
    document.getElementById("rgResult").innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">Toplam</div>
        <div style="font-size:26px;font-weight:700;">${money(total)}</div>
        <div class="muted" style="font-size:12px;">${scoped.length} sipariş</div>
      </div>
      <div class="grid g2">${scoped.map(o=>ticketHtml(o)).join("")}</div>`;
  }
  if (rgCustomerSel) { rgCustomerSel.onchange = renderRgResult; renderRgResult(); }
}

async function parseExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
}

function bindCustomer(){
  bindShellCommon("custTab");
  document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{
    const [id, delta] = b.dataset.qty.split("|");
    S.cart[id] = Math.max(0, (S.cart[id]||0) + Number(delta));
    render();
  });
  const submitBtn = document.getElementById("submitOrderBtn");
  if (submitBtn) submitBtn.onclick = async () => {
    const cartItems = Object.entries(S.cart).filter(([,q])=>q>0).map(([id,qty])=>{
      const p = S.products.find(pr=>pr.id===id);
      return { productId:id, name:p.name, kitchen:kitchenName(p.kitchenId), price:p.price, unit:p.unit, qty };
    });
    if (!cartItems.length) return;
    const total = cartItems.reduce((s,it)=>s+it.qty*it.price,0);
    const no = (S.orders.length+1).toString().padStart(4,"0");
    const note = document.getElementById("orderNote").value.trim();
    await addDocTo("orders", { no, customerId:S.user.id, customerName:S.user.name, items:cartItems, total, note, status:"Bekliyor", createdAt: Date.now(), delivery:null });
    S.cart = {};
    render();
  };
  document.querySelectorAll("[data-full-delivery]").forEach(b=>b.onclick=()=>{
    updateDocIn("orders", b.dataset.fullDelivery, { delivery: { type:"full", reportedAt: Date.now(), shortages: [] } });
  });
  document.querySelectorAll("[data-partial-delivery]").forEach(b=>b.onclick=()=>{
    document.getElementById("partialForm-"+b.dataset.partialDelivery).style.display = "block";
  });
  document.querySelectorAll("[data-submit-partial]").forEach(b=>b.onclick=async ()=>{
    const orderId = b.dataset.submitPartial;
    const order = S.orders.find(o=>o.id===orderId);
    const inputs = document.querySelectorAll(`[data-missing-input^="${orderId}|"]`);
    const shortages = [];
    inputs.forEach(inp=>{
      const [, productId] = inp.dataset.missingInput.split("|");
      const val = Number(inp.value||0);
      if (val>0) { const it = order.items.find(i=>i.productId===productId); shortages.push({productId, name:it.name, unit:it.unit, missingQty:val}); }
    });
    await updateDocIn("orders", orderId, { delivery: { type: shortages.length? "partial":"full", reportedAt: Date.now(), shortages } });
  });
}

/* ================= PRODUCER ================= */
const PROD_TABS = [ {key:"summary", label:"Üretim Özeti"}, {key:"orders", label:"Siparişler"} ];
function myKitchenNames(){ return S.kitchens.filter(k=>(S.user.kitchenIds||[]).includes(k.id)).map(k=>k.name); }
function producerView(){
  const body = S.prodTab==="summary" ? producerSummaryTab() : producerOrdersTab();
  return shell(S.user.name + " (Üretici)", PROD_TABS, S.prodTab, body);
}
function producerSummaryTab(){
  const mk = myKitchenNames();
  const active = S.orders.filter(o=>o.status!=="Teslim Edildi");
  const totals = {};
  active.forEach(o=>o.items.forEach(it=>{
    if (!mk.includes(it.kitchen)) return;
    const key = it.name+"|"+(it.unit||"");
    totals[key] = totals[key] || {name:it.name, unit:it.unit, qty:0};
    totals[key].qty += it.qty;
  }));
  const rows = Object.values(totals).sort((a,b)=>b.qty-a.qty);
  return `
  <h2>🏭 Üretim Özeti</h2>
  <p class="muted" style="font-size:13px;margin:6px 0 14px;">Henüz teslim edilmemiş siparişlerdeki, mutfağınıza ait toplam üretim miktarları.</p>
  <div class="grid g3">
    ${rows.map(r=>`<div class="card"><div style="font-size:14px;font-weight:600;">${esc(r.name)}</div><div style="font-size:22px;font-weight:700;color:var(--gold);">${r.qty}${r.unit?" "+esc(r.unit):""}</div></div>`).join("") || `<p class="muted">Şu an üretilmesi gereken bir şey yok.</p>`}
  </div>`;
}
function producerOrdersTab(){
  const mk = myKitchenNames();
  const relevant = S.orders.filter(o=>o.items.some(it=>mk.includes(it.kitchen))).sort((a,b)=>b.createdAt-a.createdAt);
  return `
  <h2>📋 Mutfağıma Ait Siparişler</h2>
  <div class="grid g2" style="margin-top:14px;">
    ${relevant.map(o=>`
      <div>
        ${ticketHtml(o, {kitchenFilter: mk, hidePrices:true})}
        <div class="statusbtns">
          ${STATUS_FLOW.map(s=>`<button class="statusbtn" data-set-status="${o.id}|${s}" style="background:${o.status===s?STATUS_COLOR[s]:'transparent'};color:${o.status===s?'var(--cream)':STATUS_COLOR[s]};border:1px solid ${STATUS_COLOR[s]}66;">${s}</button>`).join("")}
        </div>
      </div>`).join("") || `<p class="muted">Mutfağınıza ait sipariş yok.</p>`}
  </div>`;
}
function bindProducer(){
  bindShellCommon("prodTab");
  document.querySelectorAll("[data-set-status]").forEach(b=>b.onclick=()=>{
    const [id, status] = b.dataset.setStatus.split("|");
    updateDocIn("orders", id, { status });
  });
}

/* ================= common shell bindings ================= */
function bindShellCommon(tabStateKey){
  document.getElementById("logoutBtn").onclick = () => { S.user = null; S.cart = {}; render(); };
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S[tabStateKey] = b.dataset.tab; render(); });
}
</script>
