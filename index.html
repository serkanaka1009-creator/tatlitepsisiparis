<style>
  :root{
    --cream:#FBF3E4;
    --paper:#FFFCF6;
    --brown-deep:#3A2416;
    --brown-soft:#6E5642;
    --gold:#C0923B;
    --gold-deep:#9C7328;
    --pistachio:#748A3E;
    --pistachio-deep:#5A6E2E;
    --walnut:#8B5A34;
    --walnut-deep:#6F4526;
    --line:#E7DAC2;
    --danger:#B4472F;
    --shadow: 0 2px 10px rgba(58,36,22,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--brown-deep);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  /* header */
  .hero{
    background:radial-gradient(120% 140% at 50% -10%, #4A2F1C 0%, #2C1A0F 60%, #241408 100%);
    color:var(--cream);
    padding:24px 16px 22px;
    position:relative;
    overflow:hidden;
  }
  .logo-wrap{
    display:flex;justify-content:center;margin-bottom:10px;
  }
  .logo-wrap img{
    width:96px;height:96px;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.45));
  }
  .diamond-row{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:12px 0 10px;
    opacity:0.9;
  }
  .diamond-row span{
    width:8px;height:8px;
    background:var(--gold);
    transform:rotate(45deg);
    display:inline-block;
    border-radius:1px;
  }
  .diamond-row span:nth-child(3n+1){background:var(--pistachio);}
  .diamond-row span:nth-child(3n+2){background:var(--walnut);}
  .hero-inner{max-width:640px;margin:0 auto;text-align:center;position:relative;z-index:1;}
  .eyebrow{
    font-size:12px;letter-spacing:3px;text-transform:uppercase;
    color:var(--gold);font-weight:700;margin-bottom:6px;
  }
  .hero h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:0;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--cream);
  }
  .hero p{margin:4px 0 0;font-size:13px;color:#D9C9B4;}

  /* card sections */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-top:14px;
    box-shadow:var(--shadow);
  }
  .label{
    font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--brown-soft);margin-bottom:10px;display:block;
  }
  input[type=text], input[type=number], input[type=datetime-local], textarea, select{
    width:100%;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:9px;
    padding:11px 12px;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    color:var(--brown-deep);
    outline:none;
    transition:border-color .15s;
  }
  input:focus, textarea:focus, select:focus{border-color:var(--gold-deep);}
  textarea{resize:vertical;min-height:64px;}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .choice-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .choice-grid-3 .choice-btn{font-size:12.5px;padding:14px 6px;}
  .choice-btn{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:11px;
    padding:16px 10px;
    text-align:center;
    font-weight:700;
    font-size:14.5px;
    color:var(--brown-deep);
    cursor:pointer;
    transition:.15s;
    line-height:1.3;
  }
  .choice-btn:active{transform:scale(0.98);}
  .choice-btn.selected{
    background:var(--brown-deep);
    color:var(--cream);
    border-color:var(--brown-deep);
  }
  .choice-btn small{display:block;font-weight:500;font-size:11.5px;opacity:0.75;margin-top:2px;}

  .tag-fistikli.selected{background:var(--pistachio-deep);border-color:var(--pistachio-deep);}
  .tag-cevizli.selected{background:var(--walnut-deep);border-color:var(--walnut-deep);}

  .section-title{
    font-family:'Fraunces',serif;font-weight:600;font-size:18px;
    margin:0 0 12px;color:var(--brown-deep);
    display:flex;align-items:center;gap:8px;
  }
  .section-title .dot{width:8px;height:8px;background:var(--gold);border-radius:50%;display:inline-block;}

  .urun-row{
    display:flex;align-items:center;gap:10px;
    padding:12px 0;border-bottom:1px solid var(--line);
  }
  .urun-row:last-child{border-bottom:none;}
  .urun-row input[type=checkbox]{
    width:22px;height:22px;flex:0 0 22px;accent-color:var(--gold-deep);cursor:pointer;
  }
  .urun-row .urun-name{flex:1 1 auto;font-weight:600;font-size:14.5px;line-height:1.3;}
  .urun-row .qty-input{width:56px;flex:0 0 56px;text-align:center;padding:8px 4px;}
  .urun-row .tepsi-fixed{
    flex:0 0 auto;
    font-size:11px;font-weight:800;letter-spacing:0.4px;
    background:var(--cream);border:1px solid var(--line);
    color:var(--brown-soft);
    padding:6px 8px;border-radius:7px;white-space:nowrap;
  }

  .hint{font-size:12.5px;color:var(--brown-soft);margin-top:8px;}

  .radio-inline{display:flex;gap:10px;}
  .radio-inline label{
    flex:1;border:1.5px solid var(--line);border-radius:9px;padding:10px;
    text-align:center;font-weight:700;font-size:14px;cursor:pointer;background:#fff;
  }
  .radio-inline input{display:none;}
  .radio-inline input:checked + span{color:var(--gold-deep);}
  .radio-inline label.active{background:var(--brown-deep);color:var(--cream);border-color:var(--brown-deep);}

  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  .field-label{font-size:13px;font-weight:700;margin-bottom:6px;display:block;color:var(--brown-deep);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:11px;padding:13px 18px;
    font-weight:800;font-size:14.5px;cursor:pointer;width:100%;
    font-family:'Manrope',sans-serif;
  }
  .btn-primary{background:var(--pistachio-deep);color:#fff;}
  .btn-whatsapp{background:#25D366;color:#0b3d1f;}
  .btn-ghost{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-outline{background:#fff;color:var(--brown-deep);border:1.5px solid var(--line);}
  .btn:active{transform:scale(0.98);}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn-row .btn{width:auto;flex:1;}

  /* cart / order list */
  .siparis-header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
  .siparis-time{font-size:12px;color:var(--brown-soft);font-weight:600;}
  .cart-group-title{
    font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--gold-deep);margin:14px 0 4px;
  }
  .cart-group-title:first-child{margin-top:0;}
  .cart-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:11px 0;border-bottom:1px dashed var(--line);
  }
  .cart-item:last-child{border-bottom:none;}
  .cart-item-title{font-weight:700;font-size:14.5px;}
  .cart-item-note{font-size:12.5px;color:var(--brown-soft);margin-top:2px;white-space:pre-line;}
  .cart-item-qty{
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;
    background:var(--cream);border:1px solid var(--line);border-radius:8px;
    padding:4px 10px;flex:0 0 auto;
  }
  .cart-remove{
    background:none;border:none;color:var(--danger);font-size:12px;font-weight:700;
    cursor:pointer;padding:0;margin-top:4px;
  }
  .empty-note{color:var(--brown-soft);font-size:13.5px;font-style:italic;padding:6px 0;}

  .history-item{
    padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item .hdate{font-weight:800;color:var(--gold-deep);font-size:12px;letter-spacing:0.3px;}
  .history-item .hwho{font-weight:700;margin:2px 0;}
  .history-item .hlines{color:var(--brown-soft);white-space:pre-line;line-height:1.5;}

  .collapse-toggle{
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .chev{transition:transform .2s;font-size:14px;color:var(--brown-soft);}
  .chev.open{transform:rotate(180deg);}

  .photo-thumb{
    width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--line);
  }

  .required-star{color:var(--danger);}

  ::placeholder{color:#B9A98F;}
</style>
</head>

<div class="wrap">

  <!-- Sipariş veren -->
  <div class="card">
    <span class="label">Siparişi Veren <span class="required-star">*</span></span>
    <input type="text" id="siparisVeren" placeholder="Adınızı yazın">
  </div>

  <!-- ANA GRUP -->
  <div class="card">
    <span class="label">Ana Grup</span>
    <div class="choice-grid">
      <div class="choice-btn" data-anagrup="BAKLAVA" onclick="setAnaGrup('BAKLAVA')">BAKLAVA</div>
      <div class="choice-btn" data-anagrup="YAS_PASTA" onclick="setAnaGrup('YAS_PASTA')">YAŞ PASTA GRUBU</div>
      <div class="choice-btn" data-anagrup="KADAYIF" onclick="setAnaGrup('KADAYIF')">KADAYIF</div>
      <div class="choice-btn" data-anagrup="BOREK" onclick="setAnaGrup('BOREK')">BÖREK</div>
      <div class="choice-btn" data-anagrup="KURU_PASTA" onclick="setAnaGrup('KURU_PASTA')">KURU PASTA</div>
      <div class="choice-btn" data-anagrup="KUTU_AMBALAJ" onclick="setAnaGrup('KUTU_AMBALAJ')">KUTU VE AMBALAJ</div>
    </div>
  </div>

  <div id="dynamicArea"></div>

  <!-- SİPARİŞ -->
  <div class="card" id="siparisCard">
    <div class="siparis-header">
      <div class="section-title" style="margin-bottom:0;"><span class="dot"></span>SİPARİŞ</div>
      <div class="siparis-time" id="siparisTime"></div>
    </div>
    <div id="cartList" style="margin-top:10px;"></div>

    <div class="btn-row">
      <button class="btn btn-whatsapp" onclick="paylasWhatsapp()">📲 WhatsApp'tan Paylaş</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="siparisiSifirla()">Siparişi Sıfırla</button>
    </div>
  </div>

  <!-- GEÇMİŞ -->
  <div class="card">
    <div class="collapse-toggle" onclick="toggleHistory()">
      <div class="section-title" style="margin-bottom:0;"><span class="dot"></span>Sipariş Geçmişi</div>
      <span class="chev" id="histChev">▾</span>
    </div>
    <div id="historyList" style="display:none;margin-top:10px;"></div>
  </div>

</div>

<script>
/* ---------------- STATE ---------------- */
const state = {
  anaGrup: null,          // 'BAKLAVA' | 'YAS_PASTA'
  baklava: { tur: null, tepsi: null },      // FISTIKLI/CEVIZLI, 800/1000
  yasPasta: { altGrup: null, tur: null, digerUrun: null },   // YAS_PASTA/SOGUK_TATLILAR/SICAK_TATLILAR, OZEL/STANDART, TRELECE/EKLER
  cart: [],               // {id, title, note, qty, photoDataUrl}
  orderStartTime: null,
  history: []
};

const dynamicArea = document.getElementById('dynamicArea');

/* ---------------- STORAGE ---------------- */
const HISTORY_KEY = 'bolcek-siparis-gecmisi';

async function loadHistory(){
  try{
    const res = await window.storage.get(HISTORY_KEY, false);
    if(res && res.value){ state.history = JSON.parse(res.value); }
  }catch(e){ state.history = []; }
  renderHistory();
}

async function saveHistory(){
  try{
    await window.storage.set(HISTORY_KEY, JSON.stringify(state.history), false);
  }catch(e){ console.error('Geçmiş kaydedilemedi', e); }
}

/* ---------------- HELPERS ---------------- */
function fmtDateTime(d){
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function upsertCart(id, data){
  const idx = state.cart.findIndex(i => i.id === id);
  if(data === null){
    if(idx > -1) state.cart.splice(idx,1);
  } else if(idx > -1){
    state.cart[idx] = {...state.cart[idx], ...data};
  } else {
    state.cart.push({id, ...data});
  }
  if(state.cart.length > 0 && !state.orderStartTime){
    state.orderStartTime = new Date();
  }
  if(state.cart.length === 0){
    state.orderStartTime = null;
  }
  renderCart();
}

function addCartEntry(entry){
  state.cart.push(entry);
  if(!state.orderStartTime) state.orderStartTime = new Date();
  renderCart();
}

function removeCartEntry(id){
  const idx = state.cart.findIndex(i => i.id === id);
  if(idx > -1) state.cart.splice(idx,1);
  if(state.cart.length === 0) state.orderStartTime = null;
  renderCart();
  renderDynamic(); // uncheck any matching checkboxes
}

/* ---------------- ANA GRUP ---------------- */
function setAnaGrup(g){
  state.anaGrup = g;
  document.querySelectorAll('[data-anagrup]').forEach(el=>{
    el.classList.toggle('selected', el.dataset.anagrup === g);
  });
  // reset sub-state when switching top group (cart is untouched)
  state.baklava = { tur:null, tepsi:null };
  state.yasPasta = { altGrup:null, tur:null, digerUrun:null };
  renderDynamic();
}

const ANA_GRUP_LABELS = {
  BAKLAVA: 'BAKLAVA',
  YAS_PASTA: 'YAŞ PASTA GRUBU',
  KADAYIF: 'KADAYIF',
  BOREK: 'BÖREK',
  KURU_PASTA: 'KURU PASTA',
  KUTU_AMBALAJ: 'KUTU VE AMBALAJ'
};
const GRUP_SIRASI = ['BAKLAVA','YAŞ PASTA GRUBU','KADAYIF','BÖREK','KURU PASTA','KUTU VE AMBALAJ'];

function renderDynamic(){
  dynamicArea.innerHTML = '';
  if(state.anaGrup === 'BAKLAVA') renderBaklava();
  else if(state.anaGrup === 'YAS_PASTA') renderYasPasta();
  else if(state.anaGrup === 'KURU_PASTA') renderKuruPasta();
  else if(state.anaGrup) renderGenericGrup(state.anaGrup);
}

function renderKuruPasta(){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const urunler = [
    { key:'TATLI', ad:'TATLI KURU PASTA' },
    { key:'TUZLU', ad:'TUZLU KURU PASTA' }
  ];
  wrap.innerHTML = `<span class="label">Kuru Pasta Ürünleri</span>` +
    urunler.map(u=>{
      const id = `kurupasta|${u.key}`;
      const existing = state.cart.find(i=>i.id===id);
      const checked = !!existing;
      const qty = existing ? existing.qty : '';
      return `
      <div class="urun-row">
        <input type="checkbox" id="chk-${cssEsc(id)}" ${checked?'checked':''} onchange="onKuruPastaChange('${jsEsc(id)}','${jsEsc(u.ad)}')">
        <span class="urun-name">${u.ad}</span>
        <input type="number" min="2" class="qty-input" placeholder="Kg" value="${qty}" id="qty-${cssEsc(id)}" oninput="onKuruPastaChange('${jsEsc(id)}','${jsEsc(u.ad)}')">
        <span class="tepsi-fixed">KG</span>
      </div>`;
    }).join('') +
    `<div class="hint">En az 2 kg olacak şekilde miktar girip kutucuğu işaretleyin. Ürün otomatik olarak SİPARİŞ listesine eklenir.</div>`;
  dynamicArea.appendChild(wrap);
}

function onKuruPastaChange(id, ad){
  const chk = document.getElementById('chk-'+cssEsc(id));
  const qtyInput = document.getElementById('qty-'+cssEsc(id));
  const qty = parseInt(qtyInput.value,10);
  if(chk.checked && qty >= 2){
    upsertCart(id, { title: ad, note: 'KG', qty, grup:'KURU PASTA' });
  } else {
    upsertCart(id, null);
    if(chk.checked && qty > 0 && qty < 2){
      alert('Kuru pasta siparişi en az 2 kg olmalıdır.');
    }
  }
}

function renderGenericGrup(key){
  const label = ANA_GRUP_LABELS[key];
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <span class="label">${label} — Ürün Ekle</span>
    <div class="field">
      <span class="field-label">Ürün Adı</span>
      <input type="text" id="genUrunAd" placeholder="Ürün adını yazın">
    </div>
    <div class="field">
      <span class="field-label">Adet</span>
      <input type="number" min="1" id="genAdet" placeholder="Adet">
    </div>
    <button class="btn btn-primary" style="margin-top:6px;" onclick="genUrunEkle('${jsEsc(key)}')">Siparişe Ekle</button>
  `;
  dynamicArea.appendChild(wrap);
}

function genUrunEkle(key){
  const ad = document.getElementById('genUrunAd').value.trim();
  const adet = parseInt(document.getElementById('genAdet').value,10);
  if(!ad || !adet || adet<1){
    alert('Lütfen ürün adı ve adet girin.');
    return;
  }
  addCartEntry({ id:key+'-'+Date.now(), title: ad, note:'', qty: adet, grup: ANA_GRUP_LABELS[key] });
  document.getElementById('genUrunAd').value='';
  document.getElementById('genAdet').value='';
}

/* ---------------- BAKLAVA ---------------- */
function renderBaklava(){
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <span class="label">Baklava Türü</span>
    <div class="choice-grid">
      <div class="choice-btn tag-fistikli ${state.baklava.tur==='FISTIKLI'?'selected':''}" onclick="setBaklavaTur('FISTIKLI')">FISTIKLI BAKLAVA</div>
      <div class="choice-btn tag-cevizli ${state.baklava.tur==='CEVIZLI'?'selected':''}" onclick="setBaklavaTur('CEVIZLI')">CEVİZLİ BAKLAVA</div>
    </div>
    <div id="tepsiArea"></div>
    <div id="urunArea"></div>
  `;
  dynamicArea.appendChild(wrap);
  renderTepsiArea();
  renderUrunArea();
}

function setBaklavaTur(tur){
  state.baklava.tur = tur;
  state.baklava.tepsi = null;
  renderDynamic();
}

function renderTepsiArea(){
  const area = document.getElementById('tepsiArea');
  if(!area || !state.baklava.tur) return;
  area.innerHTML = `
    <span class="label" style="margin-top:14px;">Tepsi Boyutu</span>
    <div class="choice-grid">
      <div class="choice-btn ${state.baklava.tepsi==='800'?'selected':''}" onclick="setBaklavaTepsi('800')">800 LÜK TEPSİ</div>
      <div class="choice-btn ${state.baklava.tepsi==='1000'?'selected':''}" onclick="setBaklavaTepsi('1000')">1000 LİK TEPSİ</div>
    </div>
  `;
}

function setBaklavaTepsi(tepsi){
  state.baklava.tepsi = tepsi;
  renderDynamic();
}

function renderUrunArea(){
  const area = document.getElementById('urunArea');
  if(!area) return;
  const {tur, tepsi} = state.baklava;
  if(!tur || !tepsi){ area.innerHTML=''; return; }

  const tepsiText = tepsi === '800' ? '800 LÜK TEPSİ' : '1000 LİK TEPSİ';
  const turAdi = tur === 'FISTIKLI' ? 'FISTIKLI BAKLAVA' : 'CEVİZLİ BAKLAVA';
  const urunler = [
    { key:'KLASIK', ad:`KLASİK ${turAdi}` },
    { key:'OZEL', ad:`${turAdi} ÖZEL` }
  ];

  area.innerHTML = `<span class="label" style="margin-top:14px;">Ürünler — ${tepsiText}</span>` +
    urunler.map(u=>{
      const id = `baklava|${tur}|${tepsi}|${u.key}`;
      const existing = state.cart.find(i=>i.id===id);
      const checked = !!existing;
      const qty = existing ? existing.qty : '';
      return `
      <div class="urun-row">

const radioState = { 'ozp-ornek': null, 'ozp-foto': null };

function setRadio(group, val){
  radioState[group] = val;
  document.getElementById(group+'-evet-lbl').classList.toggle('active', val==='EVET');
  document.getElementById(group+'-hayir-lbl').classList.toggle('active', val==='HAYIR');
  if(group === 'ozp-foto'){
    const uploadWrap = document.getElementById('ozp-foto-upload-wrap');
    if(uploadWrap) uploadWrap.style.display = (val==='EVET') ? 'block' : 'none';
  }
}

function ozelYasPastaEkle(){
  const kisilik = document.getElementById('ozp-kisilik').value;
  const sekilSel = document.getElementById('ozp-sekil');
  const sekilText = sekilSel.options[sekilSel.selectedIndex] ? sekilSel.options[sekilSel.selectedIndex].text : '';
  const kat = document.getElementById('ozp-kat').value;
  const ornek = radioState['ozp-ornek'];
  const yazi = document.getElementById('ozp-yazi').value.trim();
  const fotoVarMi = radioState['ozp-foto'];
  const aciklama = document.getElementById('ozp-aciklama').value.trim();
  const teslim = document.getElementById('ozp-teslim').value;
  const fotoDosya = document.getElementById('ozp-foto-dosya');

  if(!kisilik || !sekilSel.value){
    alert('Lütfen en az "kaç kişilik" ve "pastanın şekli" alanlarını doldurun.');
    return;
  }

  const noteLines = [
    `${kisilik} kişilik`,
    sekilText ? `Şekil: ${sekilText}` : null,
    kat ? `${kat} katlı` : null,
    ornek ? `Örnek foto: ${ornek==='EVET'?'Var':'Yok'}` : null,
    yazi ? `Üzerindeki yazı: "${yazi}"` : null,
    fotoVarMi ? `Üzerine foto: ${fotoVarMi==='EVET'?'Var':'Yok'}` : null,
    aciklama ? `Açıklama: ${aciklama}` : null,
    teslim ? `Teslim: ${fmtDateTime(new Date(teslim))}` : null
  ].filter(Boolean).join('\n');

  const finish = (photoDataUrl) => {
    addCartEntry({
      id: 'ozel-yaspasta-' + Date.now(),
      title: 'ÖZEL YAŞ PASTA',
      note: noteLines,
      qty: 1,
      grup:'YAŞ PASTA GRUBU',
      photoDataUrl: photoDataUrl || null
    });
    // reset form
    radioState['ozp-ornek']=null; radioState['ozp-foto']=null;
    renderYasTurArea();
  };

  if(fotoVarMi === 'EVET' && fotoDosya && fotoDosya.files && fotoDosya.files[0]){
    const reader = new FileReader();
    reader.onload = e => finish(e.target.result);
    reader.readAsDataURL(fotoDosya.files[0]);
  } else {
    finish(null);
  }
}

/* ---------------- CART / SİPARİŞ RENDER ---------------- */
function renderCart(){
  const list = document.getElementById('cartList');
  const timeEl = document.getElementById('siparisTime');
  timeEl.textContent = state.orderStartTime ? fmtDateTime(state.orderStartTime) : '';

  if(state.cart.length === 0){
    list.innerHTML = `<div class="empty-note">Henüz ürün eklenmedi. Yukarıdan ürün seçtiğinizde burada listelenecek.</div>`;
    return;
  }

  const gruplar = GRUP_SIRASI;
  list.innerHTML = gruplar.map(grup=>{
    const items = state.cart.filter(i => (i.grup || 'DİĞER') === grup);
    if(items.length === 0) return '';
    return `
      <div class="cart-group-title">${grup}</div>
      ${items.map(item=>`
        <div class="cart-item">
          <div style="display:flex;gap:10px;">
            ${item.photoDataUrl ? `<img class="photo-thumb" src="${item.photoDataUrl}">` : ''}
            <div>
              <div class="cart-item-title">${item.title}</div>
              ${item.note ? `<div class="cart-item-note">${item.note}</div>` : ''}
              <button class="cart-remove" onclick="removeCartEntry('${jsEsc(item.id)}')">Kaldır</button>
            </div>
          </div>
          <div class="cart-item-qty">${item.qty}</div>
        </div>
      `).join('')}
    `;
  }).join('');
}

/* ---------------- WHATSAPP PAYLAŞ ---------------- */
async function paylasWhatsapp(){
  const isim = document.getElementById('siparisVeren').value.trim();
  if(!isim){
    alert('Lütfen "Siparişi Veren" alanına adınızı yazın.');
    return;
  }
  if(state.cart.length === 0){
    alert('Sipariş listesi boş. Lütfen önce ürün ekleyin.');
    return;
  }
  const dateTime = state.orderStartTime ? fmtDateTime(state.orderStartTime) : fmtDateTime(new Date());

  const lineFor = item=>{
    if(item.title === 'ÖZEL YAŞ PASTA'){
      return `ÖZEL YAŞ PASTA (${item.qty} adet)\n${item.note}`;
    }
    return `${item.note && item.note!=='ADET' ? item.note+' ' : ''}${item.title} x${item.qty}${item.note==='ADET' ? ' ADET' : ''}`;
  };

  const gruplar = GRUP_SIRASI;
  const groupedLines = [];
  gruplar.forEach(grup=>{
    const items = state.cart.filter(i => (i.grup || 'DİĞER') === grup);
    if(items.length === 0) return;
    groupedLines.push(`*${grup}*`);
    items.forEach(item => groupedLines.push(lineFor(item)));
    groupedLines.push('');
  });
  while(groupedLines.length && groupedLines[groupedLines.length-1] === '') groupedLines.pop();

  const lines = state.cart.map(lineFor); // flat version used for history storage

  const text = [
    `*TATLI TEPSİ SİPARİŞİ*`,
    `Sipariş Veren: ${isim}`,
    `Tarih/Saat: ${dateTime}`,
    ``,
    ...groupedLines
  ].join('\n');

  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');

  // history'e kaydet
  state.history.unshift({
    isim, dateTime,
    lines,
    itemCount: state.cart.reduce((s,i)=>s+i.qty,0)
  });
  state.history = state.history.slice(0,50);
  saveHistory();
  renderHistory();
}

/* ---------------- SIFIRLA ---------------- */
function siparisiSifirla(){
  if(state.cart.length === 0) return;
  if(!confirm('Mevcut siparişi tamamen sıfırlamak istediğinize emin misiniz?')) return;
  state.cart = [];
  state.orderStartTime = null;
  state.anaGrup = null;
  state.baklava = { tur:null, tepsi:null };
  state.yasPasta = { altGrup:null, tur:null, digerUrun:null };
  document.querySelectorAll('[data-anagrup]').forEach(el=>el.classList.remove('selected'));
  dynamicArea.innerHTML = '';
  renderCart();
}

/* ---------------- HISTORY ---------------- */
function toggleHistory(){
  const list = document.getElementById('historyList');
  const chev = document.getElementById('histChev');
  const open = list.style.display === 'none';
  list.style.display = open ? 'block' : 'none';
  chev.classList.toggle('open', open);
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(state.history.length === 0){
    list.innerHTML = `<div class="empty-note">Henüz kayıtlı sipariş yok.</div>`;
    return;
  }
  list.innerHTML = state.history.map(h=>`
    <div class="history-item">
      <div class="hdate">${h.dateTime}</div>
      <div class="hwho">${h.isim} — ${h.itemCount} ürün</div>
      <div class="hlines">${h.lines.join('\n')}</div>
    </div>
  `).join('');
}
