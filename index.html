<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
  :root{
    --paper:#E6D3A6; --paperDark:#D8BF8A; --ink:#2A1A0C; --inkSoft:#6B5636;
    --walnut:#2A1A0C; --walnutLight:#4A3015; --walnutDark:#190F06;
    --gold:#C08E1E; --goldLight:#F2D98A; --goldDark:#7A5A12;
    --pistachio:#6E7F49; --pistachioDark:#4F5D36;
    --brick:#9C4226; --cream:#FCF6E7; --line:#CBAD74;
    --shadow-xs: 0 1px 2px rgba(25,15,6,.14);
    --shadow-sm: 0 2px 6px rgba(25,15,6,.14), 0 1px 2px rgba(25,15,6,.10);
    --shadow-md: 0 6px 18px rgba(25,15,6,.22), 0 2px 6px rgba(25,15,6,.14);
    --shadow-lg: 0 14px 38px rgba(25,15,6,.32), 0 4px 12px rgba(25,15,6,.18);
    --shine: inset 0 1px 0 rgba(255,255,255,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;min-height:100vh;background:
    radial-gradient(1100px 480px at 8% -8%, #F4E7C2 0%, transparent 58%),
    radial-gradient(900px 560px at 108% 6%, #F4E7C2 0%, transparent 52%),
    repeating-linear-gradient(135deg, rgba(42,26,12,.025) 0px, rgba(42,26,12,.025) 1px, transparent 1px, transparent 4px),
    var(--paper);
    font-family:'Public Sans',sans-serif;color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  h2{text-shadow:0 1px 0 rgba(255,255,255,.4);letter-spacing:.1px;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{cursor:pointer;font-family:'Public Sans',sans-serif;}
  input,select{font-family:'Public Sans',sans-serif;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-size:14px;box-shadow:inset 0 1px 3px rgba(42,26,12,.1);transition:box-shadow .12s ease, border-color .12s ease;}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 1px 3px rgba(42,26,12,.1), 0 0 0 3px rgba(192,142,30,.18);}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 17px;border-radius:10px;border:none;font-weight:700;font-size:14px;letter-spacing:.1px;transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;cursor:pointer;}
  .btn:active{transform:translateY(1px) scale(.98);filter:brightness(.96);}
  .btn-primary{background:linear-gradient(180deg, var(--walnutLight), var(--walnut) 70%, var(--walnutDark));color:var(--cream);box-shadow:var(--shadow-sm), var(--shine);border:1px solid rgba(0,0,0,.3);}
  .btn-gold{background:linear-gradient(180deg, var(--goldLight), var(--gold) 50%, var(--goldDark));color:#2E1E00;font-weight:800;box-shadow:0 4px 14px rgba(122,90,18,.5), var(--shine);border:1px solid var(--goldDark);text-shadow:0 1px 0 rgba(255,255,255,.3);}
  .btn-outline{background:var(--cream);color:var(--walnut);border:1.5px solid var(--walnut);box-shadow:var(--shadow-xs);}
  .btn-ghost{background:rgba(42,26,12,.07);color:var(--inkSoft);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .card{background:linear-gradient(180deg, var(--cream), #F8EFD9);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-sm);}
  .badge{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;}
  .grid{display:grid;gap:12px;}
  .g2{grid-template-columns:1fr 1fr;}
  .g3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:700px){.g2,.g3{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:14px;border-radius:10px;overflow:hidden;}
  th{text-align:left;padding:11px 10px;background:linear-gradient(180deg, var(--paperDark), #CDAE79);color:var(--walnut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:800;}
  td{padding:10px 10px;border-top:1px solid var(--line);background:var(--cream);}
  tbody tr:nth-child(even) td{background:#F6EDD8;}
  .topbar{background:linear-gradient(180deg, var(--walnutLight), var(--walnut) 55%, var(--walnutDark));padding:14px 20px;display:flex;justify-content:space-between;align-items:center;padding-top:calc(14px + env(safe-area-inset-top,0px));box-shadow:var(--shadow-lg);position:relative;z-index:2;border-bottom:1px solid rgba(242,217,138,.25);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 20px;background:linear-gradient(180deg, rgba(255,255,255,.35), transparent);}
  .tab{padding:10px 18px;font-size:13px;font-weight:700;color:var(--inkSoft);background:var(--cream);border:1.5px solid var(--line);border-radius:10px;white-space:nowrap;box-shadow:var(--shadow-xs);transition:transform .12s ease, box-shadow .12s ease;}
  .tab:active{transform:translateY(1px);}
  .tab.active{color:var(--cream);background:linear-gradient(180deg, var(--walnutLight), var(--walnut) 80%);border-color:var(--walnutDark);box-shadow:var(--shadow-md), var(--shine);text-shadow:0 1px 1px rgba(0,0,0,.3);}
  .content{padding:20px;max-width:960px;margin:0 auto;}
  .ticket{position:relative;background:linear-gradient(180deg, var(--cream), #F7EDD7);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:'IBM Plex Mono',monospace;padding:16px;font-size:13px;box-shadow:var(--shadow-md);}
  .ticket::before,.ticket::after{content:"";position:absolute;left:0;right:0;height:8px;
    background-image:radial-gradient(circle, var(--paper) 5px, transparent 5.5px);background-size:14px 14px;}
  .ticket::before{top:0;background-position:-2px -7px;}
  .ticket::after{bottom:0;background-position:-2px 3px;}
  .row{display:flex;justify-content:space-between;align-items:center;}
  .muted{color:var(--inkSoft);}
  .statusbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .statusbtn{font-size:12px;padding:6px 13px;border-radius:99px;font-weight:700;background:transparent;transition:transform .12s ease;}
  .statusbtn:active{transform:scale(.96);}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;}
  .login-box{width:100%;max-width:420px;animation:riseIn .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
  @media (prefers-reduced-motion: reduce){.login-box{animation:none;}}
  .logo{width:76px;height:76px;border-radius:50%;background:var(--walnut);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;overflow:hidden;
    box-shadow:var(--shadow-lg), 0 0 0 3px var(--cream), 0 0 0 5px var(--goldLight), 0 0 0 6px var(--goldDark);}
  .logo img{width:100%;height:100%;object-fit:cover;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));}
  .modetabs{display:flex;background:var(--paperDark);border:1px solid var(--line);border-radius:12px;padding:5px;gap:4px;margin-bottom:18px;box-shadow:inset 0 2px 5px rgba(42,26,12,.2);}
  .modetab{flex:1;padding:9px;border:none;border-radius:8px;background:transparent;font-weight:600;font-size:13px;color:var(--inkSoft);transition:background .15s ease, box-shadow .15s ease;}
  .modetab.active{background:linear-gradient(180deg, var(--cream), #F7EDD7);color:var(--ink);box-shadow:var(--shadow-sm);}
  .cartqty{display:flex;align-items:center;gap:8px;}
  .qtybtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-weight:700;box-shadow:var(--shadow-xs);transition:transform .1s ease;}
  .qtybtn:active{transform:scale(.92);}
  .kwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .kchip{font-size:12.5px;padding:7px 14px;border-radius:99px;font-weight:700;border:1.5px solid var(--pistachioDark);background:var(--cream);color:var(--pistachioDark);box-shadow:var(--shadow-xs);transition:transform .1s ease;}
  .kchip:active{transform:scale(.96);}
  .kchip.on{background:linear-gradient(180deg, var(--pistachio), var(--pistachioDark));color:var(--cream);box-shadow:0 3px 9px rgba(79,93,54,.45), var(--shine);}
  .banner{margin-bottom:20px;padding:14px;border-radius:10px;background:linear-gradient(180deg, var(--cream), #F7EDD7);border:1px dashed var(--gold);box-shadow:var(--shadow-sm);}
  .warn{margin-bottom:16px;padding:12px;border-radius:10px;background:var(--cream);border:1px dashed var(--brick);color:var(--brick);font-size:13px;}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--inkSoft);}
  .file-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 17px;border-radius:10px;font-weight:700;font-size:14px;background:linear-gradient(180deg, var(--pistachio), var(--pistachioDark));color:var(--cream);cursor:pointer;box-shadow:0 4px 12px rgba(79,93,54,.45), var(--shine);border:1px solid var(--pistachioDark);}
</style>

const STATUS_FLOW = ["Bekliyor","Hazırlanıyor","Hazır","Teslim Edildi"];
const STATUS_COLOR = { "Bekliyor":"var(--brick)", "Hazırlanıyor":"var(--gold)", "Hazır":"var(--pistachioDark)", "Teslim Edildi":"var(--inkSoft)", "İptal Edildi":"#9a9a9a" };

function money(n){ return (n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " ₺"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function trFold(s){
  return String(s).toLocaleLowerCase("tr-TR")
    .replace(/ı/g,"i").replace(/İ/g,"i").replace(/ş/g,"s").replace(/ç/g,"c")
    .replace(/ğ/g,"g").replace(/ö/g,"o").replace(/ü/g,"u").replace(/[^a-z0-9]/g,"");
}
function kitchenName(id){ const k = S.kitchens.find(x=>x.id===id); return k? k.name : "—"; }
function productDisplayName(p){ return p.variety ? `${p.name} (${p.variety})` : p.name; }
function itemLabel(it){
  let label = it.name + (it.unit ? ` (${it.unit})` : "");
  const cd = it.cakeDetails;
  if (cd) {
    if (cd.message) label += ` | Yazı: "${cd.message}"${cd.messageOn ? ` (${cd.messageOn})` : ""}`;
    if (cd.photoNote) label += ` | Not: ${cd.photoNote}`;
  }
  return label;
}
function buildOrderItem(p, qty){
  const item = { productId:p.id, name:productDisplayName(p), kitchen:kitchenName(p.kitchenId), unit:p.unit, qty };
  if (p.needsCakeDetails) {
    const d = S.cakeDetails[p.id] || {};
    const spec = [d.shape, d.layers, d.size, d.variety].filter(Boolean).join(", ");
    if (spec) item.name = `${item.name} — ${spec}`;
    item.cakeDetails = {
      shape: d.shape||"", layers: d.layers||"", size: d.size||"", variety: d.variety||"",
      message: d.message||"", messageOn: d.message ? (d.messageOn||"") : "",
      photoNote: d.photoNote||"", photoData: d.photoData||"", referenceData: d.referenceData||""
    };
  }
  return item;
}
function cakeMissing(p){
  const d = S.cakeDetails[p.id] || {};
  return !(d.shape && d.layers && d.size);
}
function cakePanelHtml(p){
  const d = S.cakeDetails[p.id] || {};
  const sel = (field, opts, val) => `<select data-cake="${p.id}|${field}" style="width:100%;"><option value="">Seçiniz</option>${opts.map(o=>`<option value="${o}" ${o===val?"selected":""}>${o}</option>`).join("")}</select>`;
  const lbl = (t) => `<label class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px;">${t}</label>`;
  return `<div class="card" style="grid-column:1/-1;background:var(--paperDark);">
    <div style="font-weight:700;margin-bottom:10px;">🎂 Pasta Detayları — ${esc(productDisplayName(p))}</div>
    <div class="grid g3" style="margin-bottom:10px;">
      <div>${lbl("Şekil *")}${sel("shape", S.cakeShapes, d.shape)}</div>
      <div>${lbl("Kat Sayısı *")}${sel("layers", S.cakeLayers, d.layers)}</div>
      <div>${lbl("Boyut / Kişi Sayısı *")}<input data-cake="${p.id}|size" value="${esc(d.size||"")}" placeholder="örn. 2 nolu, 15 kişilik" style="width:100%;" /></div>
    </div>
    <div class="grid g3" style="margin-bottom:10px;">
      <div>${lbl("Çeşit (opsiyonel)")}${sel("variety", S.varieties, d.variety)}</div>
      <div>${lbl("Üzerine Yazı (opsiyonel)")}<input data-cake="${p.id}|message" value="${esc(d.message||"")}" placeholder="örn. İyi ki doğdun canım" style="width:100%;" /></div>
      <div>${lbl("Yazı Nerede Olsun?")}${sel("messageOn",["Pasta Üzerinde","Foto Üzerinde"], d.messageOn)}</div>
    </div>
    <div class="grid g2" style="margin-bottom:10px;">
      <div>
        ${lbl("Pastaya Basılacak Fotoğraf (opsiyonel)")}
        ${d.photoData ? `
          <div class="row" style="gap:8px;">
            <img src="${d.photoData}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow-sm);" />
            <button type="button" class="btn btn-outline" data-remove-photo="${p.id}|photoData">Kaldır</button>
          </div>
        ` : `<label class="btn btn-outline" style="width:100%;justify-content:center;cursor:pointer;">📷 Fotoğraf Seç<input type="file" accept="image/*" data-photo-input="${p.id}|photoData" style="display:none;"></label>`}
      </div>
      <div>
        ${lbl("Örnek Pasta Görseli (opsiyonel)")}
        ${d.referenceData ? `
          <div class="row" style="gap:8px;">
            <img src="${d.referenceData}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);box-shadow:var(--shadow-sm);" />
            <button type="button" class="btn btn-outline" data-remove-photo="${p.id}|referenceData">Kaldır</button>
          </div>
        ` : `<label class="btn btn-outline" style="width:100%;justify-content:center;cursor:pointer;">🖼️ Görsel Seç<input type="file" accept="image/*" data-photo-input="${p.id}|referenceData" style="display:none;"></label>`}
      </div>
    </div>
    <div id="photoStatus-${p.id}" class="muted" style="font-size:11px;margin-bottom:8px;"></div>
    <div>${lbl("Fotoğraf / örnek hakkında not (opsiyonel)")}<input data-cake="${p.id}|photoNote" value="${esc(d.photoNote||"")}" placeholder="örn. Fotoğrafı WhatsApp'tan göndereceğim" style="width:100%;" /></div>
  </div>`;
}
function resizeImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Firestore live sync ---------------- */
function watchCollection(name, targetKey){
  onSnapshot(collection(db, name), (snap) => {
    S[targetKey] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded[targetKey] = true;
    maybeRender();
  }, (err) => {
    console.error(name, err);
    S.loaded[targetKey] = true;
    S.loadErrors = S.loadErrors || [];
    S.loadErrors.push(name + ": " + err.message);
    maybeRender();
  });
}

/* ---------------- notifications (basit, sadece site açıkken) ---------------- */
let ordersFirstLoad = true;
let prevOrderStatus = {}; // id -> status
let unsubscribeOrders = null;

startOrdersWatch();

// Müşteri girişinde sadece kendi siparişlerini sorgular (Firestore okuma/trafik tasarrufu
// için — sipariş sayısı büyüdükçe her müşterinin tüm siparişleri indirmesini önler).
// Yönetici/üretici için tüm koleksiyon izlenir (ikisi de tüm siparişleri görmek zorunda).
function startOrdersWatch(){
  if (unsubscribeOrders) { unsubscribeOrders(); unsubscribeOrders = null; }
  ordersFirstLoad = true;
  prevOrderStatus = {};
  const q = (S.user && S.user.type === "customer")
    ? query(collection(db, "orders"), where("customerId", "==", S.user.id))
    : collection(db, "orders");
  unsubscribeOrders = onSnapshot(q, (snap) => {
    const newOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!ordersFirstLoad) {
      newOrders.forEach(o => {
        if (!(o.id in prevOrderStatus)) {
          notifyNewOrder(o);
        } else if (prevOrderStatus[o.id] !== o.status) {
          notifyStatusChange(o);
        }
      });
    }
    prevOrderStatus = {};
    newOrders.forEach(o => { prevOrderStatus[o.id] = o.status; });
    ordersFirstLoad = false;
    S.orders = newOrders;
    S.loaded.orders = true;
    maybeRender();
  }, (err) => {
    console.error("orders", err);
    S.loaded.orders = true;
    S.loadErrors = S.loadErrors || [];
    S.loadErrors.push("orders: " + err.message);
    maybeRender();
  });
}

function ensureNotificationPermission(){
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }
}
function playNotifySound(){
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.12;
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 180);
  } catch(e){}
}
function notify(title, body){
  playNotifySound();
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification(title, { body }); } catch(e){}
  }
}
function notifyNewOrder(o){
  if (!S.user) return;
  if (S.user.type === "admin") {
    notify("🧾 Yeni Sipariş", `${o.customerName} — Sipariş #${o.no}`);
  } else if (S.user.type === "producer") {
    const myK = S.kitchens.filter(k=>(S.user.kitchenIds||[]).includes(k.id)).map(k=>k.name);
    if (o.items.some(it=>myK.includes(it.kitchen))) {
      notify("🧾 Yeni Sipariş", `${o.customerName} — Sipariş #${o.no} (mutfağınıza ait ürün var)`);
    }
  }
}
function notifyStatusChange(o){
  if (!S.user) return;
  if (S.user.type === "customer" && o.customerId === S.user.id) {
    notify("📦 Sipariş Durumu Güncellendi", `Sipariş #${o.no}: ${o.status}`);
  }
}

const REQUIRED_UNITS = ["600'lük tepsi","800'lük tepsi","1000'lik tepsi","koli"];

onSnapshot(doc(db,"meta","units"), (d) => {
  let list = (d.exists() && Array.isArray(d.data().list) && d.data().list.length) ? d.data().list : S.units;
  const missing = REQUIRED_UNITS.filter(u => !list.some(x => x.toLocaleLowerCase("tr-TR") === u.toLocaleLowerCase("tr-TR")));
  if (missing.length) {
    list = [...list, ...missing];
    saveUnits(list);
  }
  S.units = list;
  S.loaded.units = true;
  maybeRender();
}, (err)=>{ S.loaded.units = true; maybeRender(); });

onSnapshot(doc(db,"meta","varieties"), (d) => {
  if (d.exists() && Array.isArray(d.data().list)) S.varieties = d.data().list;
  S.loaded.varieties = true;

}, (err)=>{ S.loaded.varieties = true; maybeRender(); });

onSnapshot(doc(db,"meta","cakeShapes"), (d) => {
  if (d.exists() && Array.isArray(d.data().list)) S.cakeShapes = d.data().list;
  S.loaded.cakeShapes = true;

}, (err)=>{ S.loaded.cakeShapes = true; maybeRender(); });

onSnapshot(doc(db,"meta","cakeLayers"), (d) => {

function allLoaded(){ return Object.values(S.loaded).every(Boolean); }
function maybeRender(){ if (allLoaded()) render(); }

// Emniyet: 10 saniye içinde yüklenme tamamlanmazsa (ör. internet/CDN sorunu),
// yine de ekranı göster ve kullanıcıyı bilgilendir — sonsuza kadar "Yükleniyor" ekranında kalınmasın.
setTimeout(() => {
  if (!allLoaded()) {
    Object.keys(S.loaded).forEach(k => { if (!S.loaded[k]) S.loaded[k] = true; });
    S.loadErrors = S.loadErrors || [];
    S.loadErrors.push("Bağlantı zaman aşımına uğradı — internet bağlantınızı kontrol edin.");
    render();
  }
}, 10000);

function render(){
  const app = document.getElementById("app");
  app.className = "";
  const errBanner = (S.loadErrors && S.loadErrors.length)
    ? `<div class="warn" style="max-width:700px;margin:14px auto 0;">
         ⚠ Firestore bağlantı sorunu: ${esc(S.loadErrors[0])}<br/>
         Firebase konsolunda <b>Firestore Database → Rules</b> kısmında okuma/yazma izninin açık olduğundan emin olun.

  if (!S.user) { app.innerHTML = loginView() + errBanner; bindLogin(); return; }

function ticketHtml(o, opts={}){
  const { showCustomer=true, kitchenFilter=null } = opts;
  let items = kitchenFilter ? o.items.filter(it=>kitchenFilter.includes(it.kitchen)) : o.items;
  if (kitchenFilter && items.length===0) return "";
  const grouped = {};
  items.forEach(it=>{ (grouped[it.kitchen] = grouped[it.kitchen]||[]).push(it); });
  let html = `<div class="ticket">
    <div class="row" style="margin-bottom:6px;">
      <span class="muted" style="font-size:11px;letter-spacing:1px;">SİPARİŞ #${esc(o.no)}</span>
      <span class="badge" style="background:${STATUS_COLOR[o.status]}22;color:${STATUS_COLOR[o.status]};border:1px solid ${STATUS_COLOR[o.status]}55;">${esc(o.status)}</span>
    </div>
    ${showCustomer ? `<div style="font-weight:700;font-size:14px;margin-bottom:2px;">${esc(o.customerName)}</div>` : ""}
    <div class="muted" style="font-size:11px;margin-bottom:10px;">${new Date(o.createdAt).toLocaleString("tr-TR")}${o.note?` · not: ${esc(o.note)}`:""}</div>`;
  Object.entries(grouped).forEach(([kName, its])=>{
    html += `<div style="margin-bottom:8px;"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--pistachioDark);">── ${esc(kName)} ──</div>`;
    its.forEach(it=>{
      html += `<div class="row" style="font-size:12px;padding:2px 0;">
        <span>${it.qty}${it.unit?" "+esc(it.unit):""} × ${esc(it.name)}</span>
      </div>`;
      if (it.cakeDetails) {
        const cd = it.cakeDetails;
        const lines = [];
        if (cd.message) lines.push(`✍️ Yazı: "${esc(cd.message)}"${cd.messageOn?` — ${esc(cd.messageOn)}`:""}`);
        if (cd.photoNote) lines.push(`📷 Foto/Örnek notu: ${esc(cd.photoNote)}`);
        if (lines.length) html += `<div style="font-size:11px;padding:2px 0 4px 12px;color:var(--brick);font-weight:600;">${lines.join("<br>")}</div>`;
        if (cd.photoData || cd.referenceData) {
          html += `<div class="row" style="gap:8px;padding:2px 0 6px 12px;">
            ${cd.photoData ? `<div><img src="${cd.photoData}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);" /><div class="muted" style="font-size:9px;text-align:center;">basılacak</div></div>` : ""}
            ${cd.referenceData ? `<div><img src="${cd.referenceData}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--line);" /><div class="muted" style="font-size:9px;text-align:center;">örnek</div></div>` : ""}
          </div>`;
        }
      }
    });
    html += `</div>`;
  });
  if (o.delivery){
    html += `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;">`;
    if (o.delivery.type === "full") {
      html += `<span style="color:var(--pistachioDark);font-weight:700;">✓ Müşteri: Tam Teslim Alındı</span>`;
    } else {
      html += `<span style="color:var(--brick);font-weight:700;">⚠ Müşteri: Eksik Bildirildi</span>`;
      (o.delivery.shortages||[]).forEach(s=>{
        html += `<div style="color:var(--brick);">– ${esc(s.name)}: ${s.missingQty}${s.unit?" "+esc(s.unit):""} eksik</div>`;
      });
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

window.__reportSearch = function(q){
  const el = document.getElementById("productSearchResult");
  if (!el) return;
  q = q.trim().toLocaleLowerCase("tr-TR");
  if (!q) { el.innerHTML = ""; return; }
  const byProduct = {};
  reportableOrders().forEach(o=>o.items.forEach(it=>{
    if (it.name.toLocaleLowerCase("tr-TR").includes(q)) {
      byProduct[it.name] = (byProduct[it.name]||0) + it.qty;
    }
  }));
  const entries = Object.entries(byProduct);
  const totalQty = entries.reduce((s,[,v])=>s+v,0);
  if (!entries.length) { el.innerHTML = `<p class="muted" style="font-size:13px;">Eşleşen ürün yok.</p>`; return; }
  el.innerHTML = `<div class="row" style="font-weight:700;margin-bottom:6px;"><span>Toplam</span><span>${totalQty}</span></div>` +
    entries.map(([n,q])=>`<div class="row" style="font-size:13px;padding:2px 0;"><span>${esc(n)}</span><span>${q}</span></div>`).join("");
};

  const custId = custEl ? custEl.value : "all";
  const inRange = (ts) => {
    const d = new Date(ts);
    if (from && d < new Date(from)) return false;
    if (to && d > new Date(new Date(to).setHours(23,59,59,999))) return false;
    return true;
  };
  const scoped = S.orders.filter(o => inRange(o.createdAt) && (custId==="all" || o.customerId===custId));
  const statuses = ["Bekliyor","Hazırlanıyor","Hazır","Teslim Edildi","İptal Edildi"];
  return statuses.map(st => {
    const ordersInStatus = scoped.filter(o=>o.status===st);
    const byKitchen = {};       // kitchenName -> total qty
    const byKitchenProduct = {}; // kitchenName -> { productName -> qty }
    const byCustomer = {};
    ordersInStatus.forEach(o=>{
      byCustomer[o.customerName] = (byCustomer[o.customerName]||0) + 1;
      o.items.forEach(it=>{
        byKitchen[it.kitchen]=(byKitchen[it.kitchen]||0)+it.qty;
        if (!byKitchenProduct[it.kitchen]) byKitchenProduct[it.kitchen] = {};
        const label = itemLabel(it);
        byKitchenProduct[it.kitchen][label] = (byKitchenProduct[it.kitchen][label]||0) + it.qty;
      });
    });
    const kitchens = Object.entries(byKitchen).sort((a,b)=>b[1]-a[1]).map(([k,q])=>({
      name: k, qty: q,
      products: Object.entries(byKitchenProduct[k]||{}).sort((a,b)=>b[1]-a[1])
    }));
    return { status: st, count: ordersInStatus.length,
      kitchens,
      customers: Object.entries(byCustomer).sort((a,b)=>b[1]-a[1]) };
  });
}

function exportStatusReport(){
  const data = computeStatusReport();
  const productRows = [];
  const customerRows = [];
  data.forEach(({status, kitchens, customers}) => {
    kitchens.forEach(k => {
      if (k.products.length === 0) productRows.push({ Durum: status, Mutfak: k.name, Ürün: "", Miktar: k.qty });
      k.products.forEach(([pname,q]) => productRows.push({ Durum: status, Mutfak: k.name, Ürün: pname, Miktar: q }));
    });
    customers.forEach(([n,c]) => customerRows.push({ Durum: status, Şube: n, "Sipariş Sayısı": c }));
  });
  exportMultiSheet([
    { name: "Mutfak ve Ürün Bazlı", rows: productRows.length?productRows:[{Durum:"",Mutfak:"",Ürün:"",Miktar:""}] },
    { name: "Şube Bazlı", rows: customerRows.length?customerRows:[{Durum:"",Şube:"",["Sipariş Sayısı"]:""}] },
  ], `tatli-tepsi-durum-raporu-${new Date().toISOString().slice(0,10)}.xlsx`);
}

function buildKitchenReportRows(){
  const rows = [];
  const byKitchen = {};
  reportableOrders().forEach(o=>o.items.forEach(it=>{
    if (!byKitchen[it.kitchen]) byKitchen[it.kitchen] = {};
    const label = itemLabel(it);
    byKitchen[it.kitchen][label] = (byKitchen[it.kitchen][label]||0) + it.qty;
  }));
  Object.keys(byKitchen).sort((a,b)=>a.localeCompare(b,"tr")).forEach(kName=>{
    let firstKitchenRow = true;
    Object.entries(byKitchen[kName]).sort((a,b)=>b[1]-a[1]).forEach(([pname,qty])=>{
      rows.push({ "Mutfak": firstKitchenRow ? kName : "", "Ürün": pname, "Miktar": qty });
      firstKitchenRow = false;
    });
    rows.push({ "Mutfak":"", "Ürün":"", "Miktar":"" });
  });
  return rows;
}

function buildCustomerKitchenReportRows(){
  const rows = [];
  const customersSorted = [...S.customers].sort((a,b)=>a.name.localeCompare(b.name,"tr"));
  customersSorted.forEach(c=>{
    const custOrders = reportableOrders().filter(o=>o.customerId===c.id);
    if (!custOrders.length) return;
    const byKitchen = {};
    custOrders.forEach(o=>o.items.forEach(it=>{
      if (!byKitchen[it.kitchen]) byKitchen[it.kitchen] = {};
      const label = itemLabel(it);
      byKitchen[it.kitchen][label] = (byKitchen[it.kitchen][label]||0) + it.qty;
    }));
    let firstCustRow = true;
    Object.keys(byKitchen).sort((a,b)=>a.localeCompare(b,"tr")).forEach(kName=>{
      let firstKitchenRow = true;
      Object.entries(byKitchen[kName]).sort((a,b)=>b[1]-a[1]).forEach(([pname,qty])=>{
        rows.push({
          "Müşteri": firstCustRow ? c.name : "",
          "Mutfak": firstKitchenRow ? kName : "",
          "Ürün": pname,
          "Miktar": qty,
        });
        firstCustRow = false;
        firstKitchenRow = false;
      });
    });
    rows.push({ "Müşteri":"", "Mutfak":"", "Ürün":"", "Miktar":"" });
  });
  return rows;
}

  document.querySelectorAll("[data-cancel-edit-producer]").forEach(b=>b.onclick=()=>{ S.editingProducerId = null; render(); });
  document.querySelectorAll("[data-edit-kchip]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.editKchip;
    S.editProducerKitchens = S.editProducerKitchens.includes(id) ? S.editProducerKitchens.filter(x=>x!==id) : [...S.editProducerKitchens, id];
    b.classList.toggle("on");
  });
  document.querySelectorAll("[data-save-producer]").forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.saveProducer;
    const name = document.getElementById("editProdName-"+id).value.trim();
    const username = document.getElementById("editProdUsername-"+id).value.trim().toLocaleLowerCase("tr-TR");
    const password = document.getElementById("editProdPassword-"+id).value.trim();
    if (!name || !username || S.editProducerKitchens.length===0) return;
    if (S.producers.some(p=>p.username===username && p.id!==id)) { alert("Bu kullanıcı adı başka bir üreticide kayıtlı."); return; }
    await updateDocIn("producers", id, { name, username, password, kitchenIds: S.editProducerKitchens });
    S.editingProducerId = null;
  });

  // orders
  document.querySelectorAll("[data-set-status]").forEach(b=>b.onclick=()=>{
    const [id, status] = b.dataset.setStatus.split("|");
    updateDocIn("orders", id, { status });
  });
  document.querySelectorAll("[data-admin-delete-order]").forEach(b=>b.onclick=()=>{
    if (!confirm("Bu siparişi arşive taşımak istediğinize emin misiniz? Arşivden kalıcı olarak silebilirsiniz.")) return;
    updateDocIn("orders", b.dataset.adminDeleteOrder, { archived: true, archivedAt: Date.now() });
  });
  document.querySelectorAll("[data-restore-order]").forEach(b=>b.onclick=()=>{
    updateDocIn("orders", b.dataset.restoreOrder, { archived: false });
  });
  document.querySelectorAll("[data-permanent-delete-order]").forEach(b=>b.onclick=()=>{
    if (!confirm("Bu siparişi KALICI OLARAK silmek istediğinize emin misiniz? Bu işlem geri alınamaz.")) return;
    deleteDocIn("orders", b.dataset.permanentDeleteOrder);
  });
  const archiveOldBtn = document.getElementById("archiveOldDeliveredBtn");
  if (archiveOldBtn) archiveOldBtn.onclick = async () => {
    const old = visibleOrders().filter(o=>o.status==="Teslim Edildi" && (Date.now()-o.createdAt) > 90*24*60*60*1000);
    if (!old.length) return;
    if (!confirm(`${old.length} siparişi arşive taşımak istediğinize emin misiniz?`)) return;
    await Promise.all(old.map(o=>updateDocIn("orders", o.id, { archived: true, archivedAt: Date.now() })));
  };

  // toplu seçim
  document.querySelectorAll("[data-select-order]").forEach(cb=>cb.onchange=()=>{
    const id = cb.dataset.selectOrder;
    if (cb.checked) S.selectedOrders[id] = true; else delete S.selectedOrders[id];
    render();
  });
  const selectAllBtn = document.getElementById("selectAllOrdersBtn");
  if (selectAllBtn) selectAllBtn.onclick = () => {
    visibleOrders().forEach(o=>{ S.selectedOrders[o.id] = true; });
    render();
  };
  const clearSelBtn = document.getElementById("clearSelectionBtn");
  if (clearSelBtn) clearSelBtn.onclick = () => { S.selectedOrders = {}; render(); };
  const selectByCustomerBtn = document.getElementById("selectByCustomerBtn");
  if (selectByCustomerBtn) selectByCustomerBtn.onclick = () => {
    const custId = document.getElementById("selectByCustomer").value;
    if (!custId) return;
    visibleOrders().filter(o=>o.customerId===custId).forEach(o=>{ S.selectedOrders[o.id] = true; });
    render();
  };
  const selectByDateBtn = document.getElementById("selectByDateBtn");
  if (selectByDateBtn) selectByDateBtn.onclick = () => {
    const fromVal = document.getElementById("selectFrom").value;
    const toVal = document.getElementById("selectTo").value;
    if (!fromVal && !toVal) return;
    const from = fromVal ? new Date(fromVal) : null;
    const to = toVal ? new Date(toVal) : null;
    visibleOrders().forEach(o=>{
      const d = new Date(o.createdAt);
      if (from && d < from) return;
      if (to && d > to) return;
      S.selectedOrders[o.id] = true;
    });
    render();
  };
  const bulkStatusBtn = document.getElementById("bulkStatusBtn");
  if (bulkStatusBtn) bulkStatusBtn.onclick = async () => {
    const status = document.getElementById("bulkStatusSelect").value;
    const ids = Object.keys(S.selectedOrders).filter(id=>S.selectedOrders[id]);
    if (!ids.length) return;
    if (!confirm(`${ids.length} siparişin durumunu "${status}" yapmak istediğinize emin misiniz?`)) return;
    await Promise.all(ids.map(id=>updateDocIn("orders", id, { status })));
    S.selectedOrders = {};
    render();
  };
  const bulkDeleteBtn = document.getElementById("bulkDeleteBtn");
  if (bulkDeleteBtn) bulkDeleteBtn.onclick = async () => {
    const ids = Object.keys(S.selectedOrders).filter(id=>S.selectedOrders[id]);
    if (!ids.length) return;
    if (!confirm(`${ids.length} siparişi arşive taşımak istediğinize emin misiniz?`)) return;
    await Promise.all(ids.map(id=>updateDocIn("orders", id, { archived: true, archivedAt: Date.now() })));
    S.selectedOrders = {};
    render();
  };

  // report generator
  const rgExport = document.getElementById("rgExportBtn");
  if (rgExport) rgExport.onclick = () => {
    const custId = document.getElementById("rgCustomer").value;
    const scoped = visibleOrders().filter(o => custId==="all" || o.customerId===custId);
    const rows = [];
    scoped.forEach(o=>o.items.forEach(it=>{
      const cd = it.cakeDetails || {};
      rows.push({ Tarih: new Date(o.createdAt).toLocaleString("tr-TR"), "Sipariş No": o.no, Müşteri: o.customerName, Ürün: it.name, Mutfak: it.kitchen, Miktar: it.qty, Birim: it.unit||"", "Pasta Şekli": cd.shape||"", "Kat": cd.layers||"", "Boyut / Kişi": cd.size||"", "Üzerine Yazı": cd.message||"", "Yazı Yeri": cd.messageOn||"", "Pasta Fotoğrafı": cd.photoData?"Var":"", "Örnek Görsel": cd.referenceData?"Var":"", "Foto/Örnek Notu": cd.photoNote||"", "Sipariş Notu": o.note||"", Durum: o.status });
    }));
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Rapor");
    XLSX.writeFile(wb, `tatli-tepsi-rapor-${new Date().toISOString().slice(0,10)}.xlsx`);
  };
  const rgCustomerKitchenExportBtn = document.getElementById("rgCustomerKitchenExportBtn");
  if (rgCustomerKitchenExportBtn) rgCustomerKitchenExportBtn.onclick = () => {
    const rows = buildCustomerKitchenReportRows();
    downloadTemplate(
      rows.length ? rows : [{ "Müşteri":"", "Mutfak":"", "Ürün":"", "Miktar":"" }],
      "Müşteri-Mutfak",
      `tatli-tepsi-musteri-mutfak-raporu-${new Date().toISOString().slice(0,10)}.xlsx`
    );
  };
  const rgKitchenExportBtn = document.getElementById("rgKitchenExportBtn");
  if (rgKitchenExportBtn) rgKitchenExportBtn.onclick = () => {
    const rows = buildKitchenReportRows();
    downloadTemplate(
      rows.length ? rows : [{ "Mutfak":"", "Ürün":"", "Miktar":"" }],
      "Mutfak Bazlı",
      `tatli-tepsi-mutfak-raporu-${new Date().toISOString().slice(0,10)}.xlsx`
    );
  };
  const rgCustomerSel = document.getElementById("rgCustomer");
  function renderRgResult(){
    const custId = rgCustomerSel.value;
    const scoped = reportableOrders().filter(o => custId==="all" || o.customerId===custId);
    document.getElementById("rgResult").innerHTML = `
      <div class="card" style="margin-bottom:14px;">
        <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;">Sipariş Sayısı</div>
        <div style="font-size:26px;font-weight:700;">${scoped.length}</div>
      </div>
      <div class="grid g2">${scoped.map(o=>ticketHtml(o)).join("")}</div>`;
  }
  if (rgCustomerSel) { rgCustomerSel.onchange = renderRgResult; renderRgResult(); }

  // status report
  const srFrom = document.getElementById("srFrom");
  const srTo = document.getElementById("srTo");
  const srCustomer = document.getElementById("srCustomer");
  const srClear = document.getElementById("srClear");
  const srExportBtn = document.getElementById("srExportBtn");
  if (srFrom) { srFrom.onchange = renderStatusReport; renderStatusReport(); }
  if (srTo) srTo.onchange = renderStatusReport;
  if (srCustomer) srCustomer.onchange = renderStatusReport;
  if (srClear) srClear.onclick = () => { srFrom.value=""; srTo.value=""; srCustomer.value="all"; renderStatusReport(); };
  if (srExportBtn) srExportBtn.onclick = exportStatusReport;
}

async function parseExcel(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""});
}
function downloadTemplate(rows, sheetName, filename){
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename);
}
function exportMultiSheet(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(({name, rows})=>{
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });
  XLSX.writeFile(wb, filename);
}

function bindCustomer(){
  bindShellCommon("custTab");
  document.querySelectorAll("[data-toggle-kitchen]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.toggleKitchen;
    S.openKitchens[id] = !S.openKitchens[id];
    render();
  });
  document.querySelectorAll("[data-no-order]").forEach(b=>b.onclick=()=>{
    const id = b.dataset.noOrder;
    S.noOrderKitchens[id] = !S.noOrderKitchens[id];
    render();
  });
  document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{
    const [id, delta] = b.dataset.qty.split("|");
    S.cart[id] = Math.max(0, (S.cart[id]||0) + Number(delta));
    const p = S.products.find(pr=>pr.id===id);
    if (p && S.cart[id] > 0) delete S.noOrderKitchens[p.kitchenId];
    render();
  });
  document.querySelectorAll("[data-cake]").forEach(el=>{
    const handler = () => {
      const [pid, field] = el.dataset.cake.split("|");
      S.cakeDetails[pid] = S.cakeDetails[pid] || {};
      S.cakeDetails[pid][field] = el.value;
    };
    el.oninput = handler;
    el.onchange = () => { handler(); if (el.tagName === "SELECT") render(); };
  });
  document.querySelectorAll("[data-photo-input]").forEach(el=>{
    el.onchange = async () => {
      const file = el.files[0];
      if (!file) return;
      const [pid, field] = el.dataset.photoInput.split("|");
      const statusEl = document.getElementById("photoStatus-"+pid);
      if (statusEl) statusEl.textContent = "Yükleniyor…";
      try {
        const dataUrl = await resizeImageToDataUrl(file, 600, 0.55);
        S.cakeDetails[pid] = S.cakeDetails[pid] || {};
        S.cakeDetails[pid][field] = dataUrl;
        render();
      } catch (err) {
        if (statusEl) statusEl.textContent = "Fotoğraf yüklenemedi, tekrar deneyin.";
      }
    };
  });
  document.querySelectorAll("[data-remove-photo]").forEach(b=>b.onclick=()=>{
    const [pid, field] = b.dataset.removePhoto.split("|");
    if (S.cakeDetails[pid]) delete S.cakeDetails[pid][field];
    render();
  });
  const submitBtn = document.getElementById("submitOrderBtn");
  if (submitBtn) submitBtn.onclick = async () => {
    const cartItems = Object.entries(S.cart).filter(([,q])=>q>0).map(([id,qty])=>{
      const p = S.products.find(pr=>pr.id===id);
      return p ? buildOrderItem(p, qty) : null;
    }).filter(Boolean);
    if (!cartItems.length) return;
    const note = document.getElementById("orderNote").value.trim();
    if (S.editingOrderId) {
      await updateDocIn("orders", S.editingOrderId, { items: cartItems, note });
      S.editingOrderId = null;
    } else {
      // Zaman damgası tabanlı: müşteriler artık sadece kendi siparişlerini gördüğü için
      // (performans amacıyla), "toplam sipariş sayısı+1" yöntemi farklı müşterilerde
      // aynı numarayı üretebilirdi — bu yüzden benzersizliğe daha yakın bir yöntem kullanıyoruz.
      const no = String(Date.now()).slice(-6);
      await addDocTo("orders", { no, customerId:S.user.id, customerName:S.user.name, items:cartItems, note, status:"Bekliyor", createdAt: Date.now(), delivery:null });
    }
    S.cart = {};
    S.cakeDetails = {};
    S.noOrderKitchens = {};
    S.openKitchens = {};
    render();
  };
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  if (cancelEditBtn) cancelEditBtn.onclick = () => { S.editingOrderId = null; S.cart = {}; S.cakeDetails = {}; S.noOrderKitchens = {}; S.openKitchens = {}; render(); };
  document.querySelectorAll("[data-edit-order]").forEach(b=>b.onclick=()=>{
    const order = S.orders.find(o=>o.id===b.dataset.editOrder);
    if (!order) return;
    const cart = {};
    S.cakeDetails = {};
    order.items.forEach(it=>{
      cart[it.productId] = it.qty;
      if (it.cakeDetails) S.cakeDetails[it.productId] = { ...it.cakeDetails };
    });
    S.cart = cart;
    S.editingOrderId = order.id;
    S.noOrderKitchens = {};
    S.openKitchens = {};
    S.kitchens.forEach(k=>{
      const has = order.items.some(it=>S.products.find(p=>p.id===it.productId)?.kitchenId===k.id);
      if (!has) S.noOrderKitchens[k.id] = true;
    });
    S.custTab = "new";
    render();
  });
  document.querySelectorAll("[data-cancel-order]").forEach(b=>b.onclick=()=>{
    if (!confirm("Bu siparişi iptal etmek istediğinize emin misiniz?")) return;
    updateDocIn("orders", b.dataset.cancelOrder, { status: "İptal Edildi" });
  });
  document.querySelectorAll("[data-self-delete-order]").forEach(b=>b.onclick=()=>{
    if (!confirm("Bu siparişi silmek istediğinize emin misiniz?")) return;
    updateDocIn("orders", b.dataset.selfDeleteOrder, { archived: true, archivedAt: Date.now() });
  });
  document.querySelectorAll("[data-full-delivery]").forEach(b=>b.onclick=()=>{
    updateDocIn("orders", b.dataset.fullDelivery, { delivery: { type:"full", reportedAt: Date.now(), shortages: [] } });
  });
  document.querySelectorAll("[data-partial-delivery]").forEach(b=>b.onclick=()=>{
    document.getElementById("partialForm-"+b.dataset.partialDelivery).style.display = "block";
  });
  document.querySelectorAll("[data-submit-partial]").forEach(b=>b.onclick=async ()=>{
    const orderId = b.dataset.submitPartial;
    const order = S.orders.find(o=>o.id===orderId);
    const inputs = document.querySelectorAll(`[data-missing-input^="${orderId}|"]`);
    const shortages = [];
    inputs.forEach(inp=>{
      const [, productId] = inp.dataset.missingInput.split("|");
      const val = Number(inp.value||0);
      if (val>0) { const it = order.items.find(i=>i.productId===productId); shortages.push({productId, name:it.name, unit:it.unit, missingQty:val}); }
    });
    await updateDocIn("orders", orderId, { delivery: { type: shortages.length? "partial":"full", reportedAt: Date.now(), shortages } });
  });
}

/* ================= PRODUCER ================= */
const PROD_TABS = [ {key:"summary", label:"Üretim Özeti"}, {key:"orders", label:"Siparişler"} ];
function myKitchenNames(){ return S.kitchens.filter(k=>(S.user.kitchenIds||[]).includes(k.id)).map(k=>k.name); }
function producerView(){
  const body = S.prodTab==="summary" ? producerSummaryTab() : producerOrdersTab();
  return shell(S.user.name + " (Üretici)", PROD_TABS, S.prodTab, body);
}
function producerSummaryTab(){
  const mk = myKitchenNames();
  const active = visibleOrders().filter(o=>o.status!=="Teslim Edildi" && o.status!=="İptal Edildi");
  const totals = {};
  active.forEach(o=>o.items.forEach(it=>{
    if (!mk.includes(it.kitchen)) return;
    const key = it.name+"|"+(it.unit||"");
    totals[key] = totals[key] || {name:it.name, unit:it.unit, qty:0};
    totals[key].qty += it.qty;
  }));
  const rows = Object.values(totals).sort((a,b)=>b.qty-a.qty);
  return `
  <div class="row" style="margin-bottom:6px;">
    <h2>🏭 Üretim Özeti</h2>
    <button type="button" class="btn btn-gold" id="prodSummaryExportBtn">⬇ Excel'e Aktar</button>
  </div>
  ${noActiveOrderBanner()}
  <p class="muted" style="font-size:13px;margin:6px 0 14px;">Henüz teslim edilmemiş siparişlerdeki, mutfağınıza ait toplam üretim miktarları.</p>
  <div class="grid g3">
    ${rows.map(r=>`<div class="card"><div style="font-size:14px;font-weight:600;">${esc(r.name)}</div><div style="font-size:22px;font-weight:700;color:var(--gold);">${r.qty}${r.unit?" "+esc(r.unit):""}</div></div>`).join("") || `<p class="muted">Şu an üretilmesi gereken bir şey yok.</p>`}
  </div>`;
}
function buildProducerCustomerKitchenReportRows(mk){
  const rows = [];
  const customersSorted = [...S.customers].sort((a,b)=>a.name.localeCompare(b.name,"tr"));
  customersSorted.forEach(c=>{
    const custOrders = reportableOrders().filter(o=>o.customerId===c.id);
    const byKitchen = {};
    custOrders.forEach(o=>o.items.forEach(it=>{
      if (!mk.includes(it.kitchen)) return;
      if (!byKitchen[it.kitchen]) byKitchen[it.kitchen] = {};
      const label = itemLabel(it);
      byKitchen[it.kitchen][label] = (byKitchen[it.kitchen][label]||0) + it.qty;
    }));
    const kitchenNames = Object.keys(byKitchen);
    if (!kitchenNames.length) return;
    let firstCustRow = true;
    kitchenNames.sort((a,b)=>a.localeCompare(b,"tr")).forEach(kName=>{
      let firstKitchenRow = true;
      Object.entries(byKitchen[kName]).sort((a,b)=>b[1]-a[1]).forEach(([pname,qty])=>{
        rows.push({
          "Müşteri": firstCustRow ? c.name : "",
          "Mutfak": firstKitchenRow ? kName : "",
          "Ürün": pname,
          "Miktar": qty,
        });
        firstCustRow = false;
        firstKitchenRow = false;
      });
    });
    rows.push({ "Müşteri":"", "Mutfak":"", "Ürün":"", "Miktar":"" });
  });
  return rows;
}
function producerOrdersTab(){
  const mk = myKitchenNames();
  const relevant = visibleOrders().filter(o=>o.status!=="İptal Edildi" && o.items.some(it=>mk.includes(it.kitchen))).sort((a,b)=>b.createdAt-a.createdAt);
  const liveProd = S.producers.find(p=>p.id===S.user.id) || S.user;
  const canDelete = !!liveProd.canDeleteOrders;
  return `
  <div class="row" style="margin-bottom:6px;">
    <h2>📋 Mutfağıma Ait Siparişler</h2>
    <button type="button" class="btn btn-gold" id="prodOrdersExportBtn">⬇ Excel'e Aktar</button>
  </div>
  <div class="grid g2" style="margin-top:14px;">
    ${relevant.map(o=>`
      <div>
        ${ticketHtml(o, {kitchenFilter: mk})}
        <div class="statusbtns">
          ${STATUS_FLOW.map(s=>`<button type="button" class="statusbtn" data-set-status="${o.id}|${s}" style="background:${o.status===s?STATUS_COLOR[s]:'transparent'};color:${o.status===s?'var(--cream)':STATUS_COLOR[s]};border:1px solid ${STATUS_COLOR[s]}66;">${s}</button>`).join("")}
          ${canDelete ? `<button type="button" class="statusbtn" data-producer-delete-order="${o.id}" style="background:transparent;color:var(--brick);border:1px solid var(--brick);margin-left:auto;">🗑 Sil</button>` : ""}
        </div>
      </div>`).join("") || `<p class="muted">Mutfağınıza ait sipariş yok.</p>`}
  </div>`;
}
function bindProducer(){
  bindShellCommon("prodTab");
  document.querySelectorAll("[data-set-status]").forEach(b=>b.onclick=()=>{
    const [id, status] = b.dataset.setStatus.split("|");
    updateDocIn("orders", id, { status });
  });
  document.querySelectorAll("[data-producer-delete-order]").forEach(b=>b.onclick=()=>{
    if (!confirm("Bu siparişi silmek istediğinize emin misiniz?")) return;
    updateDocIn("orders", b.dataset.producerDeleteOrder, { archived: true, archivedAt: Date.now() });
  });
  const prodSummaryExportBtn = document.getElementById("prodSummaryExportBtn");
  if (prodSummaryExportBtn) prodSummaryExportBtn.onclick = () => {
    const mk = myKitchenNames();
    const active = visibleOrders().filter(o=>o.status!=="Teslim Edildi" && o.status!=="İptal Edildi");
    const totals = {};
    active.forEach(o=>o.items.forEach(it=>{
      if (!mk.includes(it.kitchen)) return;
      totals[it.name+"|"+(it.unit||"")] = totals[it.name+"|"+(it.unit||"")] || {name:it.name, unit:it.unit, qty:0};
      totals[it.name+"|"+(it.unit||"")].qty += it.qty;
    }));
    const rows = Object.values(totals).sort((a,b)=>b.qty-a.qty).map(r=>({ Ürün: r.name, Birim: r.unit||"", Miktar: r.qty }));
    downloadTemplate(rows.length?rows:[{Ürün:"",Birim:"",Miktar:""}], "Üretim Özeti", `uretim-ozeti-${new Date().toISOString().slice(0,10)}.xlsx`);
  };
  const prodOrdersExportBtn = document.getElementById("prodOrdersExportBtn");
  if (prodOrdersExportBtn) prodOrdersExportBtn.onclick = () => {
    const mk = myKitchenNames();
    const rows = buildProducerCustomerKitchenReportRows(mk);
    downloadTemplate(rows.length?rows:[{ "Müşteri":"", "Mutfak":"", "Ürün":"", "Miktar":"" }], "Müşteri-Mutfak", `musteri-mutfak-raporu-${new Date().toISOString().slice(0,10)}.xlsx`);
  };
}

/* ================= common shell bindings ================= */
function bindShellCommon(tabStateKey){
  document.getElementById("logoutBtn").onclick = () => { S.user = null; S.cart = {}; S.cakeDetails = {}; S.selectedOrders = {}; startOrdersWatch(); render(); };
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ S[tabStateKey] = b.dataset.tab; render(); });
}
</script>
